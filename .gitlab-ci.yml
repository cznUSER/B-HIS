stages:
  - quality
  - web
  - integration

default:
  interruptible: true

variables:
  # Keep the full history available for the whitespace check on merge requests
  # and the first pipeline on a branch.
  GIT_DEPTH: "0"
  GOTOOLCHAIN: local

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

diff:check:
  stage: quality
  image: alpine:3.20
  script:
    - apk add --no-cache git
    - |
      zero_sha="0000000000000000000000000000000000000000"
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        base_sha="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ "${CI_COMMIT_BEFORE_SHA:-$zero_sha}" != "$zero_sha" ]; then
        base_sha="$CI_COMMIT_BEFORE_SHA"
      else
        base_sha="HEAD~1"
      fi
      git diff --check "$base_sha" "$CI_COMMIT_SHA"

go:test:
  stage: quality
  image: golang:1.22-bookworm
  script:
    - unset BHIS_DASHBOARD_TEST_DSN
    - go test ./... -count=1

go:vet:
  stage: quality
  image: golang:1.22-bookworm
  script:
    - go vet ./...

web:quality:
  stage: web
  image: node:22-bookworm-slim
  script:
    - npm --prefix web ci
    - npm --prefix web run check
    - npm --prefix web run build

# SQL-backed integration tests are deliberately opt-in. The test suite skips
# them without BHIS_DASHBOARD_TEST_DSN, and this guard prevents accidentally
# pointing the job at a production database.
sql:integration:
  stage: integration
  image: golang:1.22-bookworm
  resource_group: bhis-phase2-test-20261015
  script:
    - |
      test "${BHIS_DASHBOARD_TEST_DB:-}" = "BHIS_PHASE2_TEST_20261015" \
        || { echo "BHIS_DASHBOARD_TEST_DB must be BHIS_PHASE2_TEST_20261015"; exit 1; }
      test -n "${BHIS_DASHBOARD_TEST_DSN:-}" \
        || { echo "BHIS_DASHBOARD_TEST_DSN is required"; exit 1; }
      scheme="${BHIS_DASHBOARD_TEST_DSN%%://*}"
      test "$scheme" = "sqlserver" \
        || { echo "BHIS_DASHBOARD_TEST_DSN must use the sqlserver URL scheme"; exit 1; }
      authority="${BHIS_DASHBOARD_TEST_DSN#*://}"
      authority="${authority%%\?*}"
      server="${authority##*@}"
      test "$server" = "192.168.1.138:53151" \
        || { echo "BHIS_DASHBOARD_TEST_DSN must target the isolated Code A SQL endpoint"; exit 1; }
      query=$(printf '%s' "$BHIS_DASHBOARD_TEST_DSN" | sed 's/^[^?]*?//')
      databases=$(printf '%s' "$query" | tr '&;' '\n' | sed -n 's/^database=//p')
      test "$databases" = "BHIS_PHASE2_TEST_20261015" \
        || { echo "BHIS_DASHBOARD_TEST_DSN must contain only database=BHIS_PHASE2_TEST_20261015"; exit 1; }
    - go test ./internal/store/mssql -count=1
  rules:
    - if: '$BHIS_SQL_INTEGRATION == "true"'
      when: manual
      allow_failure: false
    - when: never
