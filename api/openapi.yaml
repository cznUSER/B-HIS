    CreateUserRequest:
      type: object
      required: [username, displayName]
      description: |
        新建采用演示默认口令策略（#15/#16）；勿在请求示例中写生产秘密。
        可选显式 password 字段仅供实现期本地覆盖；契约不要求客户端传明文。
      properties:
        username: { type: string, minLength: 1 }
        loginName: { type: string, description: ≡ username 别名 }
        displayName: { type: string, minLength: 1 }
        description: { type: string }
        cardNo: { type: string }
        inputCode: { type: string }
        password: { type: string, minLength: 8, maxLength: 72, format: password, description: 可选；留空保持原密码不变 }
        serviceStar: { type: integer, minimum: 1, maximum: 5, nullable: true }
        expandInterface1: { type: integer, format: int32, nullable: true }
        expandInterface2: { type: integer, format: int32, nullable: true }
        inputCodeCompareMode: { type: integer, format: int32, nullable: true, default: 2 }
        roles:
          type: array
          items: { type: string }
          description: 内置或自定义角色；账号安全标记受服务端保护规则约束
        roleScopes:
          type: array
          description: |
            可选的完整显式用户角色范围集合。每行 roleCode 必须属于 roles；字段省略或 [] 均不写入显式范围，新用户按各角色旧 moduleCode/departmentId 兼容授权。
            任一角色存在至少一行（包括 DISABLED）时，该角色不再继承旧 departmentId；只有 ACTIVE 行参与授权。
          items: { $ref: '#/components/schemas/UserRoleScopeInput' }
        status: { type: string, enum: [ACTIVE, DISABLED], default: ACTIVE }
        mustChangePassword: { type: boolean }
        cannotModifyPassword: { type: boolean }
        accountStopped: { type: boolean }
        hidden: { type: boolean }
        system: { type: boolean }
        super: { type: boolean }
        developer: { type: boolean }
        permissionOverrides:
          type: array
          description: 用户与权限整屏提交时的完整权限例外集合；与用户资料、角色和成功审计同一事务保存。
          items: { $ref: '#/components/schemas/PermissionOverrideInput' }
