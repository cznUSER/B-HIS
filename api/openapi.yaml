      summary: 挂号（初始 status=NORMAL；拍板#19 科室+医生）
      description: |
        必填 patientId + departmentId + doctorId + visitDate。
        患者不存在 → 404 PATIENT_NOT_FOUND；科室/医生不存在 → 404 DEPARTMENT_NOT_FOUND / DOCTOR_NOT_FOUND；医生不属于所选科室 → 409 DOCTOR_DEPARTMENT_MISMATCH。
        registerSort 可选占位；registerFee 默认 0；registerCharged 默认 false。
      operationId: createRegister
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '404':
          description: PATIENT_NOT_FOUND / DEPARTMENT_NOT_FOUND / DOCTOR_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Registers]
      summary: 挂号查询（按 patientId / registerNo）
      operationId: searchRegisters
      parameters:
        - name: patientId
          in: query
          schema: { type: string }
        - name: registerNo
          in: query
          schema: { type: string }
        - name: visitDate
          in: query
          description: 可选就诊日过滤
          schema: { type: string, format: date }
        - { name: visitDateFrom, in: query, schema: { type: string, format: date }, description: '近诊历史范围起日；包含边界；日期范围查询按最新建单优先' }
        - { name: visitDateTo, in: query, schema: { type: string, format: date }, description: '近诊历史范围止日；包含边界' }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasMore: { type: boolean }
                  nextOffset: { type: integer, nullable: true }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegisterDto'
  /registers/slot-board:
    get:
      tags: [Registers]
      summary: 读取科室及医生当日可挂号源（Asia/Shanghai）
      description: |
        沿现有挂号读取权限及科室范围。workingHours 按 slotMinutes 展开，单格 capacity=1。
        未退号且未删除的预约与有时段现场号均占用；占用查询不受挂号历史100行上限影响。
        无任何排班的医生 scheduleConfigured=false、remain=null；已排班但当日休诊 remain=0。
        这是瞬时可用量；创建挂号由事务内重叠检查终裁，冲突409 APPOINTMENT_CONFLICT。
      operationId: registerSlotBoard
      parameters:
        - { name: visitDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: departmentId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: doctorId, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: 当日号源
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterSlotBoardDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
