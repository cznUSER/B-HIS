openapi: 3.0.3
info:
  title: H Phase1 Outpatient Loop API
  version: 0.3.8-draft
  description: |
    P1-H03-CHARGE 契约草案 v0.3.8（收费 Charge/Payment；对齐拍板#13/#22 + H08 交接）。
    挂号六态、开单四态、Square Abate+新单、CanBack、卡状态已对齐。
    实现基线：Go API（可桌面 Host 托管）+ SQL Server；Store 可切换。
    库存方案 A（真实扣减）；Inventory 查询启用；**收费侧**拦库存（开单只提示）。
    Auth：JWT HS256 access token（默认 TTL 8h）；login/logout/me 供 H04+H05 登录页落地。
    拍板#13/#22：已发药须先退药（REFUND_REQUIRES_RETURN）；收费须有效挂号（ENCOUNTER_REQUIRED；
    registerId≡encounterId）；支付演示现金一次付清+电子字段预留不联调；实收=应收（不允许多收找零）；
    F=0 主路径硬断言 K-01～K-05；默认不拆方 1:1；全退 newSquare=null；毒麻 feature flag 默认 off。
    v0.3.4/H08：refund 含 favourableAlloc；策略枚举 PROPORTIONAL|DISCOUNT_ON_REMAIN|DISCOUNT_FIRST
    （H08 草稿待用户确认，非已拍板）；错误码含 INVALID_AMOUNT；交叉引用 deliverables/h08/。
    v0.3.5/P1-H03-PATIENT：CreatePatientRequest.required=[name,sex,birthday,fareIdentity]；
    address 选填可空；idNumber/cardNo 非空查重 → 409 DUPLICATE_*；拒绝不合并（拍板#20）。
    v0.3.6/P1-H03-REGISTER：主路径 /registers（Encounter≡RegisterBill；encounterId≡registerId）；
    迁移 sqlserver/core/003_register（+ seed）；拍板#19。
    v0.3.7/P1-H03-ORDER：主字段 registerId；save+commit+abate；004_order（+ seed DRUG-A/B/TREAT-1）。
    v0.3.8/P1-H03-CHARGE：charge-preview、POST /charges、pay、refund、GET /charges；
    ChargeDto 主字段 registerId（encounterId≡别名）；successorChargeId；RefundResponse.newSquare 全退 null；
    PayRequest.amount 必须=squareFee；迁移 sqlserver/core/005_charge（+ 空 seed）；拍板#22。
    旧 /encounters* 保留为 deprecated alias。
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Patients
  - name: Registers
    description: |
      挂号单（RegisterBill）。域内 Encounter ≡ RegisterBill；API 主路径 /registers。
      订单/收费字段名可继续用 encounterId（语义 ≡ registerId）。
  - name: Encounters
    description: Deprecated alias of Registers；请改用 /registers。
  - name: Orders
    description: |
      门诊处方（order_sheet + order_item）。主字段 registerId（encounterId≡registerId）。
      状态主路径 SAVE→COMMIT→（收费后）PROC；作废 ABATE 仅未收费。
      拍板#21：强制有效挂号；save+commit；多处方；诊断不强制；毒麻关；审核一期跳过。
  - name: Charges
    description: |
      门诊结算（charge + charge_item + payment）。主字段 registerId（encounterId≡registerId）。
      拍板#22：强制有效挂号；现金一次付清；F=0 主路径；默认不拆 1:1；全退 newSquare=null；
      实收=应收；收费拦库存；已发药须先退药。迁移 005_charge。
  - name: Dispenses
  - name: Diagnoses
  - name: Inventory
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录（匿名）；返回 JWT Bearer accessToken
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: AUTH_RATE_LIMITED（可选）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出；服务端使 token 失效（jti 黑名单或会话表）
      operationId: logout
      responses:
        '204':
          description: No Content
        '200':
          description: OK（允许返回 success 包络）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /auth/me:
    get:
      tags: [Auth]
      summary: 当前登录用户与角色
      operationId: me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: UNAUTHORIZED / TOKEN_EXPIRED / TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /patients:
    post:
      tags: [Patients]
      summary: 建档（证件/卡号冲突拒绝不合并）
      operationId: createPatient
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDto'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Patients]
      summary: 患者查询
      operationId: searchPatients
      parameters:
        - name: cardNo
          in: query
          schema: { type: string }
        - name: idNumber
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
        - name: hospPkNo
          in: query
          schema: { type: string }
        - name: address
          in: query
          description: 地址模糊（可选）
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientDto'
  /patients/{patientId}:
    get:
      tags: [Patients]
      summary: 患者详情
      operationId: getPatient
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDto'
        '404':
          $ref: '#/components/responses/NotFound'
  /registers:
    post:
      tags: [Registers]
      summary: 挂号（初始 status=NORMAL；拍板#19 科室+医生）
      description: |
        必填 patientId + departmentId + doctorId + visitDate。
        患者不存在 → 404 PATIENT_NOT_FOUND；科室/医生不存在 → 404 DEPARTMENT_NOT_FOUND / DOCTOR_NOT_FOUND。
        registerSort 可选占位；registerFee 默认 0；registerCharged 默认 false。
      operationId: createRegister
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '404':
          description: PATIENT_NOT_FOUND / DEPARTMENT_NOT_FOUND / DOCTOR_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Registers]
      summary: 挂号查询（按 patientId / registerNo）
      operationId: searchRegisters
      parameters:
        - name: patientId
          in: query
          schema: { type: string }
        - name: registerNo
          in: query
          schema: { type: string }
        - name: visitDate
          in: query
          description: 可选就诊日过滤
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegisterDto'
  /registers/{registerId}:
    get:
      tags: [Registers]
      summary: 挂号单详情
      operationId: getRegister
      parameters:
        - $ref: '#/components/parameters/RegisterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '404':
          $ref: '#/components/responses/NotFound'
  /registers/{registerId}/check-in:
    post:
      tags: [Registers]
      summary: 接诊 → DIAGNOSING（可延后实现）
      operationId: checkInRegister
      parameters:
        - $ref: '#/components/parameters/RegisterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /registers/{registerId}/complete:
    post:
      tags: [Registers]
      summary: 就诊完成 → DIAGNOSED（可延后实现）
      operationId: completeRegister
      parameters:
        - $ref: '#/components/parameters/RegisterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /registers/{registerId}/cancel:
    post:
      tags: [Registers]
      summary: 退号 → BACK（仅 NORMAL 可退；AC-03/AC-04）
      description: |
        默认仅 status=NORMAL → BACK；写 backOperatorId / backOperatedAt。
        USED / DIAGNOSING / DIAGNOSED / PAUSED → 409 REGISTER_NOT_CANCELLABLE。
        已 BACK → 409 REGISTER_BACK_NOT_ALLOWED（或 REGISTER_NOT_CANCELLABLE）。
        一期不允许退已用号（无开关 UI）。
      operationId: cancelRegister
      parameters:
        - $ref: '#/components/parameters/RegisterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          description: REGISTER_NOT_CANCELLABLE / REGISTER_BACK_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /encounters:
    post:
      tags: [Encounters]
      deprecated: true
      summary: "[deprecated] 请改用 POST /registers"
      description: |
        Deprecated alias。请求/响应 schema 与 /registers 相同（CreateRegisterRequest / RegisterDto）。
        encounterId ≡ registerId。
      operationId: createEncounter
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
  /encounters/{encounterId}/check-in:
    post:
      tags: [Encounters]
      deprecated: true
      summary: "[deprecated] 请改用 POST /registers/{registerId}/check-in"
      operationId: checkInEncounter
      parameters:
        - $ref: '#/components/parameters/EncounterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /encounters/{encounterId}/complete:
    post:
      tags: [Encounters]
      deprecated: true
      summary: "[deprecated] 请改用 POST /registers/{registerId}/complete"
      operationId: completeEncounter
      parameters:
        - $ref: '#/components/parameters/EncounterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /encounters/{encounterId}/cancel:
    post:
      tags: [Encounters]
      deprecated: true
      summary: "[deprecated] 请改用 POST /registers/{registerId}/cancel"
      operationId: cancelEncounter
      parameters:
        - $ref: '#/components/parameters/EncounterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /registers/{registerId}/diagnoses:
    post:
      tags: [Diagnoses]
      summary: 创建/保存诊断（可选最小实体；挂在 registerId）
      operationId: createDiagnoseOnRegister
      parameters:
        - $ref: '#/components/parameters/RegisterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiagnoseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnoseDto'
  /encounters/{encounterId}/diagnoses:
    post:
      tags: [Diagnoses]
      summary: 创建/保存诊断（可选最小实体）
      operationId: createDiagnose
      parameters:
        - $ref: '#/components/parameters/EncounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiagnoseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnoseDto'
  /diagnoses/{diagnoseId}/commit:
    post:
      tags: [Diagnoses]
      summary: 提交诊断
      operationId: commitDiagnose
      parameters:
        - name: diagnoseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnoseDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /diagnoses/{diagnoseId}/abate:
    post:
      tags: [Diagnoses]
      summary: 作废诊断
      operationId: abateDiagnose
      parameters:
        - name: diagnoseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnoseDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders:
    post:
      tags: [Orders]
      summary: 创建/暂存开单（status=SAVE；须有效挂号，否则 ENCOUNTER_REQUIRED）
      description: |
        创建一张门诊处方（暂存）。status 初始 SAVE，不可收费。
        **必填 registerId**（有效挂号且 status≠BACK）；无则 409 ENCOUNTER_REQUIRED（拍板#21a / O-P1）。
        encounterId 为同义别名（≡registerId）；若两者都传须一致。
        patientId / departmentId / doctorId 可选：服务端默认从挂号带出；doctorId 允许改（#21b）；
        若传入 patientId 须与挂号一致。diagnoseName 不强制（#21c）。
        items 可空（纯草稿）；提交(commit)时至少 1 行且 amount>0。
        一张挂号允许多张处方（#21d）。开单库存仅提示不拦（#21f）。
        毒麻精抗校验本版关闭（feature flag 默认 off）。无 Go handler（归 H04）。
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created（status=SAVE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '409':
          description: |
            ENCOUNTER_REQUIRED（无有效挂号/已退号 BACK）/
            CATALOG_ITEM_NOT_FOUND（可选）/
            ORDER_INVALID_AMOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    get:
      tags: [Orders]
      summary: 开单查询（按 registerId / patientId / status / orderNo）
      operationId: searchOrders
      parameters:
        - name: registerId
          in: query
          description: 挂号单 ID（≡encounterId）
          schema: { type: string }
        - name: encounterId
          in: query
          description: 同义别名 ≡ registerId（deprecated 字段名，语义相同）
          schema: { type: string }
          deprecated: true
        - name: patientId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [SAVE, COMMIT, PROC, ABATE]
        - name: orderNo
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderDto'
  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: 处方详情（头+明细）
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Orders]
      summary: 更新草稿（仅 SAVE；全量替换 items）
      description: |
        仅 status=SAVE 可改头/明细；否则 409 ORDER_NOT_EDITABLE。
        若请求体含 items，则 **全量替换** 明细行（按 lineNo）；省略 items 则仅改头字段。
        registerId 创建后不可改。
      operationId: patchOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchOrderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '409':
          description: ORDER_NOT_EDITABLE / ORDER_INVALID_AMOUNT / ENCOUNTER_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /orders/{orderId}/commit:
    post:
      tags: [Orders]
      summary: 提交开单 SAVE→COMMIT（提交后可收费）
      description: |
        前置：status=SAVE；至少 1 行明细；每行 amount>0；否则 ORDER_EMPTY_ITEMS / ORDER_INVALID_AMOUNT /
        ORDER_NOT_COMMITTABLE。
        成功：status=COMMIT；totalFee=Σ明细行 totalFee；写 submittedAt；可供收费载入。
        挂号仍须有效（≠BACK），否则 ENCOUNTER_REQUIRED。
        处方审核一期跳过（不经 RECIPE_CHECK）。
      operationId: commitOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK（status=COMMIT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '409':
          description: |
            ORDER_NOT_COMMITTABLE / ORDER_EMPTY_ITEMS / ORDER_INVALID_AMOUNT /
            ENCOUNTER_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /orders/{orderId}/submit:
    post:
      tags: [Orders]
      summary: 提交开单（deprecated alias → commit）
      description: |
        **Deprecated**：与 `POST /orders/{orderId}/commit` 同语义（SAVE→COMMIT）。
        新客户端请改用 /commit。
      operationId: submitOrder
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK（同 commit）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/{orderId}/abate:
    post:
      tags: [Orders]
      summary: 作废处方（仅未收费的 SAVE/COMMIT → ABATE）
      description: |
        仅 charged=false 且 status∈{SAVE,COMMIT} 可作废 → ABATE（终态）。
        已收费（charged=true）→ 409 ORDER_CHARGED_NOT_ABATABLE（须走退费链）。
        PROC/ABATE 不可再作废 → ORDER_NOT_EDITABLE / ILLEGAL_STATE_TRANSITION。
      operationId: abateOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK（status=ABATE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '409':
          description: ORDER_CHARGED_NOT_ABATABLE / ILLEGAL_STATE_TRANSITION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /orders/{orderId}/recipe-check:
    post:
      tags: [Orders]
      summary: 处方审核（一期跳过 / deferred）
      description: |
        **一期不实现**（拍板#21g / H02 O-P 审核延后）：提交(commit)后即可进收费，不经审核关卡。
        路径保留占位；实现可返回 501 NOT_IMPLEMENTED 或直接透传当前 OrderDto。
        毒麻精抗校验本版关闭（feature flag 默认 off）。
      operationId: recipeCheckOrder
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK（若实现透传）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '501':
          description: NOT_IMPLEMENTED（一期推荐）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/{orderId}/charge-preview:
    get:
      tags: [Orders, Charges]
      summary: 费用预览（自已提交处方 COMMIT；须有效挂号）
      description: |
        对齐拍板#22i / 22j。前置：Order.status=COMMIT；register status≠BACK。
        返回待收口径 ChargeDto（未落库亦可）；F=0 时 totalFee=squareFee（K-01/K-02）。
        库存不足仅在 POST /charges 或 pay 时拦截（开单只提示）。
      operationId: previewCharge
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeDto'
        '409':
          description: |
            非 COMMIT / 无有效挂号 → ENCOUNTER_REQUIRED 等。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /orders/{orderId}/dispense:
    post:
      tags: [Dispenses]
      summary: 发药（须已收费；方案A含库存扣减；→ PROC）
      operationId: dispenseOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispenseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispenseDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /charges:
    get:
      tags: [Charges]
      summary: 结算单列表（按患者 / 挂号 / 日）
      description: |
        拍板#22i。至少提供一种过滤：patientId、registerId|encounterId、visitDate 或 from+to。
        encounterId 语义 ≡ registerId。
      operationId: listCharges
      parameters:
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: registerId
          in: query
          description: 挂号单 ID（主字段）
          schema: { type: string, format: uuid }
        - name: encounterId
          in: query
          deprecated: true
          description: ≡ registerId（别名）
          schema: { type: string, format: uuid }
        - name: visitDate
          in: query
          description: 单日（与挂号 visitDate 或 charge.created_at 日对齐；实现择一写清）
          schema: { type: string, format: date }
        - name: from
          in: query
          description: 起始日（含）；与 to 成对
          schema: { type: string, format: date }
        - name: to
          in: query
          description: 结束日（含）
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChargeDto'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Charges]
      summary: 自已提交处方载入/创建待收 Square（须 COMMIT + 有效挂号）
      description: |
        拍板#22。body.orderId 必填。前置：Order=COMMIT；register status≠BACK → 否则 ENCOUNTER_REQUIRED。
        默认不拆：一处方一张 Charge（A21）。收费侧库存不足 → INSUFFICIENT_STOCK。
        成功：待收 Charge（paidAt=null）；尚未写 Payment。
      operationId: createChargeFromOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /charges/{chargeId}:
    get:
      tags: [Charges]
      summary: 结算单详情
      operationId: getCharge
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeDto'
        '404':
          $ref: '#/components/responses/NotFound'
  /charges/{chargeId}/pay:
    post:
      tags: [Charges]
      summary: 收费确认（现金一次付清；实收=应收；须有效挂号）
      description: |
        拍板#22b/22f/22g。PayRequest.payType 主路径 CASH；amount **必须等于** squareFee
        （不允许多收找零）否则 CHARGE_AMOUNT_MISMATCH / INVALID_AMOUNT。
        库存不足 → INSUFFICIENT_STOCK。成功：Charge NORMAL + paidAt；Payment CHARGE SUCCEEDED。
        F=0 硬断言 K-01～K-05。
      operationId: payCharge
      parameters:
        - $ref: '#/components/parameters/ChargeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /charges/{chargeId}/refund:
    post:
      tags: [Charges]
      summary: 退费（先退药；Abate+可选新 Square；全退 newSquare=null）
      description: |
        拍板#22e/22h。已发药须先退药 → 否则 409 REFUND_REQUIRES_RETURN。
        同事务：原单 ABATE；若有未退数量生成新 NORMAL（abatedFromId）；**全退不生成金额0新单，newSquare=null**。
        favourableAlloc 默认 PROPORTIONAL（H08 草稿待确认，非正式拍板）；F=0 可硬断言。
      operationId: refundCharge
      parameters:
        - $ref: '#/components/parameters/ChargeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResultDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /dispenses/{dispenseId}/return:
    post:
      tags: [Dispenses]
      summary: 退药（原因必填；→ RECIPE_UNCHECK）
      operationId: returnDispense
      parameters:
        - name: dispenseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnDispenseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispenseDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /inventory/items:
    get:
      tags: [Inventory]
      summary: 库存查询（方案A 已拍板启用）
      operationId: listInventory
      parameters:
        - name: skuCode
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryItemDto'
        '501':
          description: StatusOnly mode
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Phase1 默认 JWT access token（HS256）。
        Header: Authorization: Bearer <accessToken>
        TTL 默认 8h，可配置。refresh 延后。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
    PatientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegisterId:
      name: registerId
      in: path
      required: true
      description: 挂号单 ID（≡ encounterId）
      schema: { type: string, format: uuid }
    EncounterId:
      name: encounterId
      in: path
      required: true
      description: Deprecated 路径参数；语义 ≡ registerId
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChargeId:
      name: chargeId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    BadRequest:
      description: |
        Validation / invalid amount.
        常见 code: VALIDATION_ERROR, INVALID_AMOUNT（对齐 H08）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: |
        Conflict / illegal state / business rule（对齐 H08 错误码清单）。
        常见 code: DUPLICATE_PATIENT, REGISTER_NOT_CANCELLABLE,
        REGISTER_BACK_NOT_ALLOWED, PATIENT_NOT_FOUND, DEPARTMENT_NOT_FOUND,
        DOCTOR_NOT_FOUND, ENCOUNTER_REQUIRED（已确认：收费/开单须有效挂号，退号 BACK 拒开）,
        ORDER_EMPTY_ITEMS, ORDER_INVALID_AMOUNT, ORDER_NOT_EDITABLE,
        ORDER_NOT_COMMITTABLE, ORDER_CHARGED_NOT_ABATABLE, CATALOG_ITEM_NOT_FOUND,
        ILLEGAL_STATE_TRANSITION, INSUFFICIENT_STOCK, ITEM_NOT_CAN_BACK,
        REFUND_REQUIRES_RETURN（已确认强制：已发药须先退药再退费）,
        REFUND_EXCEEDS_REFUNDABLE, CHARGE_AMOUNT_MISMATCH,
        NOT_CHARGED, ALREADY_ABATED, ALREADY_DISPENSED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, format: password }
    UserDto:
      type: object
      required: [id, username, displayName, roles]
      properties:
        id: { type: string, description: 用户主键 }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string }
          description: 角色代码，如 SYSTEM / REGISTRAR / DOCTOR / CASHIER / PHARMACIST
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, description: JWT（HS256） }
        tokenType: { type: string, enum: [Bearer], example: Bearer }
        expiresIn: { type: integer, description: 秒；默认 28800（8h）可配置, example: 28800 }
        user:
          $ref: '#/components/schemas/UserDto'
    ErrorBody:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        requestId: { type: string }
    CreatePatientRequest:
      type: object
      required: [name, sex, birthday, fareIdentity]
      properties:
        name: { type: string, description: '姓名必填（H02 P-01 / 建档清单）' }
        sex: { type: string, enum: [M, F, U], description: '一期必填' }
        birthday: { type: string, format: date, description: '>1900-01-01 且 ≤今天（DB CHECK >1900-01-01；≤今天由应用校验）' }
        idType: { type: string }
        idNumber: { type: string, description: '选填；非空则查重，冲突 409 DUPLICATE_ID_NUMBER / DUPLICATE_PATIENT；拒绝不合并' }
        cardNo: { type: string, description: '选填；非空则查重，冲突 409 DUPLICATE_CARD_NO；拒绝不合并' }
        phone: { type: string }
        address: { type: string, nullable: true, description: '选填可空（H02 建档清单）' }
        fareIdentity: { type: string, description: '费别一期必填' }
    PatientDto:
      type: object
      properties:
        patientId: { type: string, format: uuid, description: '契约侧 uuid 格式字符串；实现库存 varchar(64)' }
        hospPkNo: { type: string }
        patientNo: { type: string }
        cardNo: { type: string }
        name: { type: string }
        sex: { type: string }
        birthday: { type: string, format: date }
        idNumber: { type: string }
        phone: { type: string }
        address: { type: string, nullable: true }
        fareIdentity: { type: string }
        cardStatus:
          type: string
          enum: [NOT_SENT, NORMAL, LOST, CANCELLED]
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
    CreateRegisterRequest:
      type: object
      required: [patientId, departmentId, doctorId, visitDate]
      description: |
        对齐 H02 挂号字段清单。号源=科室+医生（拍板#19）；无排班。
        registerSort 可选占位；registerFee 默认 0。
      properties:
        patientId: { type: string, format: uuid, description: '必填；不存在 → PATIENT_NOT_FOUND' }
        departmentId: { type: string, description: '必填；主数据科室 id（种子如 dept-1）；不存在 → DEPARTMENT_NOT_FOUND' }
        doctorId: { type: string, description: '必填；主数据医生 id（种子如 doc-1）；不存在 → DOCTOR_NOT_FOUND' }
        visitDate: { type: string, format: date, description: '就诊日必填' }
        registerSort: { type: string, nullable: true, description: '号别可选占位（如 sort-normal）；可空' }
        registerFee: { type: number, description: '挂号费；默认 0；一期可不做正式结算' }
    RegisterDto:
      type: object
      description: |
        挂号单 DTO。域内 Encounter ≡ RegisterBill。
        订单/收费若仍用 encounterId 字段名，语义 ≡ registerId。
      properties:
        registerId: { type: string, format: uuid, description: '≡ encounterId；实现库存 varchar(64)' }
        registerNo: { type: string, description: '挂号单号 UK' }
        patientId: { type: string, format: uuid }
        departmentId: { type: string }
        doctorId: { type: string }
        registerSort: { type: string, nullable: true }
        visitDate: { type: string, format: date }
        status:
          type: string
          enum: [NORMAL, USED, BACK, DIAGNOSING, DIAGNOSED, PAUSED]
          description: 对齐 TRegisterStatus；创建默认 NORMAL
        registerFee: { type: number, description: '默认 0' }
        registerCharged: { type: boolean, description: '默认 false' }
        registeredAt: { type: string, format: date-time }
        backOperatorId: { type: string, nullable: true }
        backOperatedAt: { type: string, format: date-time, nullable: true }
    CreateEncounterRequest:
      allOf:
        - $ref: '#/components/schemas/CreateRegisterRequest'
      deprecated: true
      description: Deprecated alias of CreateRegisterRequest（encounterId≡registerId）
    EncounterDto:
      allOf:
        - $ref: '#/components/schemas/RegisterDto'
      deprecated: true
      description: |
        Deprecated alias of RegisterDto。
        兼容字段：若实现仍返回 encounterId/encounterNo/deptCode/clinicSort，
        分别对应 registerId/registerNo/departmentId/registerSort。
    CreateDiagnoseRequest:
      type: object
      properties:
        content: { type: string }
    DiagnoseDto:
      type: object
      properties:
        diagnoseId: { type: string, format: uuid }
        encounterId: { type: string, format: uuid, description: '≡ registerId' }
        status: { type: string, enum: [NEW, SAVE, COMMIT, ABATE] }
        content: { type: string }
    OrderItemInput:
      type: object
      required: [itemNo, itemType, itemName, amount, price]
      properties:
        lineNo: { type: integer, description: 行号；创建时可省略由服务端按序生成（从 1） }
        itemNo: { type: string, description: 目录编码（如 DRUG-A / TREAT-1） }
        itemType: { type: string, enum: [DRUG, TREAT], description: '药品 DRUG / 治疗 TREAT（一期；原 SERVICE 改为 TREAT）' }
        itemName: { type: string }
        spec: { type: string, nullable: true, description: 规格（目录带出） }
        units: { type: string, description: 单位（目录带出；原 unit 字段更名为 units） }
        amount: { type: number, description: '数量；须 > 0（提交时强制；暂存建议亦 >0）' }
        price: { type: number, description: '单价；≥ 0' }
        totalFee: { type: number, description: '行金额；可省略由服务端 round2(amount*price)' }
        usageText: { type: string, nullable: true, description: 用法文案（选填） }
        frequencyText: { type: string, nullable: true, description: 频次文案（选填） }
        dosage: { type: string, nullable: true }
        dosageUnit: { type: string, nullable: true }
        procDepartmentId: { type: string, nullable: true, description: 执行科室（选填） }
    CreateOrderRequest:
      type: object
      required: [registerId]
      description: |
        创建/暂存。registerId 必填且须有效（status≠BACK）。
        encounterId 为同义别名；若同时传入须与 registerId 一致。
        items 可空（纯草稿）；commit 时至少 1 行。
      properties:
        registerId:
          type: string
          format: uuid
          description: '挂号单 ID；须有效且 status≠BACK，否则 ENCOUNTER_REQUIRED（#21a）'
        encounterId:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: '≡ registerId（别名）；优先用 registerId'
        patientId:
          type: string
          format: uuid
          nullable: true
          description: '可选；默认从挂号带出；若传须与挂号 patientId 一致'
        departmentId:
          type: string
          format: uuid
          nullable: true
          description: '开单科室；默认挂号科室'
        doctorId:
          type: string
          format: uuid
          nullable: true
          description: '开单医生；默认=挂号医生，允许改（#21b）'
        diagnoseName:
          type: string
          nullable: true
          description: '诊断简述；不强制（#21c）；UI 鼓励填写'
        recipeSort:
          type: string
          nullable: true
          description: '处方类别；默认 NORMAL；毒麻精抗权校验本版关闭（feature flag 默认 off）'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
          description: 明细；创建时可空；commit 至少 1 行
    PatchOrderRequest:
      type: object
      description: |
        仅 SAVE 可 PATCH。含 items 时全量替换明细；省略 items 则只改头。
        不可改 registerId。
      properties:
        patientId: { type: string, format: uuid, nullable: true }
        departmentId: { type: string, format: uuid, nullable: true }
        doctorId: { type: string, format: uuid, nullable: true, description: 允许改开单医生 }
        diagnoseName: { type: string, nullable: true }
        recipeSort: { type: string, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
          description: 若出现则全量替换明细行
    OrderItemDto:
      allOf:
        - $ref: '#/components/schemas/OrderItemInput'
        - type: object
          required: [orderItemId, totalFee]
          properties:
            orderItemId: { type: string, format: uuid }
            totalFee: { type: number, description: '行金额 round2(amount*price)' }
    OrderDto:
      type: object
      required: [orderId, orderNo, registerId, patientId, departmentId, doctorId, status, totalFee, charged]
      properties:
        orderId: { type: string, format: uuid }
        orderNo: { type: string, description: 系统生成处方号 }
        registerId:
          type: string
          format: uuid
          description: '挂号单 ID（主字段）'
        encounterId:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: '≡ registerId（别名，响应可同时返回）'
        patientId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        diagnoseName: { type: string, nullable: true }
        recipeSort: { type: string, nullable: true, description: 默认 NORMAL }
        status:
          type: string
          enum: [SAVE, COMMIT, PROC, ABATE]
          description: |
            一期四态（拍板#21 / 004_order CHECK）。
            SAVE=暂存不可收费；COMMIT=已提交可收费；PROC=发药执行；ABATE=作废终态。
            RECIPE_CHECK 等 CureBill 扩展态一期跳过（不入库 CHECK）。
        totalFee: { type: number, description: 'Σ明细；commit 时强制重算' }
        charged: { type: boolean, description: '是否已收费；true 时不可 abate' }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'
        submittedAt: { type: string, format: date-time, nullable: true }
        abatedAt: { type: string, format: date-time, nullable: true }
        abatedBy: { type: string, nullable: true }
    ChargeItemDto:
      type: object
      required: [chargeItemId, lineNo, itemNo, itemName, qty, unitPrice, totalFee, canBack]
      properties:
        chargeItemId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid, nullable: true }
        lineNo: { type: integer }
        itemNo: { type: string }
        itemName: { type: string }
        qty:
          type: number
          description: '收费数量；须 >0（C-02）。API 亦可用 amount 别名（实现择一，契约主字段 qty）'
        unitPrice:
          type: number
          description: '单价。API 亦可用 price 别名'
        totalFee: { type: number }
        canBack: { type: boolean, description: '可退标记；false → ITEM_NOT_CAN_BACK' }
        refundedQty: { type: number, description: '已退数量；默认 0；≤qty' }
    ChargeDto:
      type: object
      required: [chargeId, squareNo, registerId, patientId, totalFee, squareFee, favourableFee, status]
      description: |
        结算单（Square）。主字段 registerId；encounterId≡registerId 别名。
        拍板#22a：无有效挂号不可创建/支付 → ENCOUNTER_REQUIRED。
      properties:
        chargeId: { type: string, format: uuid }
        squareNo: { type: string }
        orderId: { type: string, format: uuid, nullable: true, description: 'Phase1 主路径有值；可空策略允许多来源' }
        registerId:
          type: string
          format: uuid
          description: '挂号单 ID（主字段，必填）；≡ encounterId'
        encounterId:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: '≡ registerId（别名）；响应可同时返回'
        patientId: { type: string, format: uuid }
        totalFee: { type: number, description: '毛额 G；F=0 时与 squareFee 同（K-01/K-02）' }
        squareFee: { type: number, description: '应收 R = G - F' }
        favourableFee: { type: number, description: '整单优惠 F；Phase1 验收主路径 0（#22c）' }
        status:
          type: string
          enum: [NORMAL, ABATE]
          description: 对齐 TSquareStatus / H08
        successorChargeId:
          type: string
          format: uuid
          nullable: true
          description: '作废后生成的新单（未退部分）；全退为 null。旧名 successorSquareId 弃用'
        abatedFromId:
          type: string
          format: uuid
          nullable: true
          description: 若本单由退费生成，指向被作废原单
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChargeItemDto'
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: '支付成功时间；待收为 null'
    PayRequest:
      type: object
      required: [payType, amount]
      description: |
        拍板#22b/22f：现金一次付清；amount 必须等于 Charge.squareFee（实收=应收，不允许多收找零）。
      properties:
        paymentNo: { type: string, nullable: true, description: '可选；省略由服务端生成' }
        payType:
          type: string
          enum: [CASH, OTHER_E, WECHAT, ALIPAY, OTHER]
          description: |
            Phase1（拍板#13/#22b）：演示主用 CASH；
            OTHER_E/WECHAT/ALIPAY 字段预留可落库，不联调第三方。
        amount:
          type: number
          description: '必须 = squareFee；否则 CHARGE_AMOUNT_MISMATCH / INVALID_AMOUNT'
    FavourableAlloc:
      type: string
      enum: [PROPORTIONAL, DISCOUNT_ON_REMAIN, DISCOUNT_FIRST]
      default: PROPORTIONAL
      description: |
        部分退优惠分摊策略（H08《金额核对点》§4 **草稿待确认**，非正式拍板 #22c）。
        PROPORTIONAL：按退毛额占比分摊（H08 推荐草稿 / 默认可配）。
        DISCOUNT_ON_REMAIN：优惠留在未退。
        DISCOUNT_FIRST：优惠优先退。
        Phase1：F=0 时可忽略本字段，硬断言 K-01～K-05（收费）/ K-10～K-15（退费）；F>0 期望值待用户经 H01 确认。
    RefundRequest:
      type: object
      required: [payType, items]
      description: |
        对齐 H08 交接 §1.4 + 拍板#22。
        前置：Square=NORMAL；已发药明细必须先退药成功，否则 409 REFUND_REQUIRES_RETURN（#22h / B-08）。
        全退：不生成金额为 0 的新 Square → newSquare=null（#22e）。
      properties:
        reason: { type: string, description: '退费原因；建议填写' }
        payType:
          type: string
          enum: [CASH, OTHER_E, WECHAT, ALIPAY, OTHER]
          description: Phase1 演示 CASH；电子枚举预留不联调
        favourableAlloc:
          $ref: '#/components/schemas/FavourableAlloc'
        items:
          type: array
          items:
            type: object
            required: [chargeItemId, refundQty]
            properties:
              chargeItemId: { type: string, format: uuid }
              refundQty:
                type: number
                description: |
                  部分数量退；须 ≤可退且 canBack。
                  已发药明细须先退药，否则 REFUND_REQUIRES_RETURN。
                  超额 → REFUND_EXCEEDS_REFUNDABLE；金额非法 → INVALID_AMOUNT。
    RefundResultDto:
      type: object
      required: [abatedCharge, refundPayment]
      description: |
        退费响应。全退时 newSquare 必须为 null（#22e）；部分退时 newSquare 为承接未退的新 NORMAL。
      properties:
        abatedCharge:
          $ref: '#/components/schemas/ChargeDto'
          description: '已作废原单（status=ABATE）'
        newSquare:
          allOf:
            - $ref: '#/components/schemas/ChargeDto'
          nullable: true
          description: '未退部分新 Square；**全退必须 null**（不生成金额 0 新单）'
        refundPayment:
          $ref: '#/components/schemas/PaymentDto'
    PaymentDto:
      type: object
      required: [paymentId, paymentNo, chargeId, direction, payType, amount, status]
      properties:
        paymentId: { type: string, format: uuid }
        paymentNo: { type: string }
        chargeId: { type: string, format: uuid }
        direction:
          type: string
          enum: [CHARGE, REFUND]
          description: 收费 CHARGE / 退款 REFUND（H08）
        payType:
          type: string
          enum: [CASH, OTHER_E, WECHAT, ALIPAY, OTHER]
          description: Phase1 演示 CASH；电子枚举预留可落库、不联调
        amount:
          type: number
          description: '≥0；收费时须 = squareFee；非法 → INVALID_AMOUNT'
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
          description: 支付/退费成功须为 SUCCEEDED（H08）；Phase1 成功写 SUCCEEDED
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: '成功时间（主字段）；succeededAt 为兼容别名'
        succeededAt:
          type: string
          format: date-time
          nullable: true
          deprecated: true
          description: '≡ paidAt（别名）'
    DispenseRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [orderItemId, qty]
            properties:
              orderItemId: { type: string, format: uuid }
              qty: { type: number }
    ReturnDispenseRequest:
      type: object
      required: [reason, items]
      properties:
        reason: { type: string, description: 退药原因必填 }
        items:
          type: array
          items:
            type: object
            required: [dispenseItemId, qty]
            properties:
              dispenseItemId: { type: string, format: uuid }
              qty: { type: number }
    DispenseItemDto:
      type: object
      properties:
        dispenseItemId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid }
        qty: { type: number }
    DispenseDto:
      type: object
      properties:
        dispenseId: { type: string, format: uuid }
        dispenseNo: { type: string }
        orderId: { type: string, format: uuid }
        charged: { type: boolean }
        status: { type: string }
        orderStatus:
          type: string
          description: 权威处方状态 PROC / RECIPE_UNCHECK 等
        returnReason: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/DispenseItemDto'
        dispensedAt: { type: string, format: date-time }
    InventoryItemDto:
      type: object
      properties:
        skuId: { type: string, format: uuid }
        skuCode: { type: string }
        name: { type: string }
        qtyOnHand: { type: number }
