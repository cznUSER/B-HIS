  /inventory/batches:
    get:
      tags: [Inventory]
      summary: 查询隔离药品批次/效期快照（只读）
      description: |
        P2-6A 开发验证切片。只读 dbo.inventory_batch 隔离快照，不读写 inventory_item、inventory_ledger、dispense 或 dispense_item，不能代表采购、调拨、盘点、FEFO 或真实历史批次。
        需要独立权限 `inventory:batch-read`；`inventory:adjust` 不可替代。asOfDate 与 expiryWindowDays 必须显式提供，避免机器当前日期漂移。
        状态：expireDate 为空为 UNKNOWN；早于 asOfDate 为 EXPIRED；asOfDate 至窗口末日（含）为 EXPIRING；窗口末日之后为 VALID。
      operationId: listInventoryBatches
      parameters:
        - name: skuCode
          in: query
          schema: { type: string, maxLength: 64 }
        - name: storageUnitId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: batchNo
          in: query
          schema: { type: string, maxLength: 64 }
        - name: expiryStatus
          in: query
          schema: { type: string, enum: [UNKNOWN, VALID, EXPIRING, EXPIRED] }
        - name: asOfDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: expiryWindowDays
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 3660 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryBatchPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /inventory/items/{skuId}/adjust:
    post:
      tags: [Inventory]
      summary: 库存总量调整（期初/盘盈/盘亏 · #24f / H09）
      description: |
        同事务：更新 inventory_item.qty_on_hand + 追加 inventory_ledger（biz_type=**ADJUST**）。
        qtyDelta 可正可负；结果须 ≥0，否则 409 ADJUST_RESULT_NEGATIVE。
        期初/盘盈/盘亏**均**走 ADJUST + remark 区分；**不新造 INIT**（H09）。
        与发药 DISPENSE / 退药 RETURN 共写同一 qty_on_hand；ledger 只追加。
        可选乐观锁 rowVersion（若请求携带且冲突 → 409 CONFLICT / 条件更新失败）。
        TREAT 或无库存 SKU → 409 NOT_DRUG_SKU。
        权限：`inventory:adjust` 或 `admin:*`。审计 action **`inventory.adjust`**（#24f / H09 强制补列）。
        不足/负库存勿绕过；业务发药侧不足仍用 INSUFFICIENT_STOCK（本接口不发该码作成功路径）。
      operationId: adjustInventory
      parameters:
        - $ref: '#/components/parameters/SkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustInventoryRequest'
      responses:
        '200':
          description: OK（返回更新后库存行）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
