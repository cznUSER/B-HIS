    post:
      tags: [Dispenses]
      summary: 确认发药（须已收费 NORMAL+paid；仅 DRUG；事务扣库存）
      description: |
        拍板#23 + H02§3 + H09。前置：覆盖 orderId 的 Charge status=NORMAL 且 paidAt≠null；
        否则 409 NOT_CHARGED。仅处理 DRUG 行；TREAT 忽略/拒。
        body.items[].dispenseQty：0 < qty ≤ availableQty（availableQty=chargedQty−dispensedQty 净发）。
        超额 → DISPENSE_EXCEEDS_AVAILABLE；空明细 → EMPTY_DISPENSE_ITEMS；
        已满发再发 → ALREADY_DISPENSED（≡ H02 ALREADY_FULLY_DISPENSED）；不得二次扣减。
        **同事务**：CheckStorages → 扣 qty_on_hand → 写 ledger(DISPENSE,负) → 建 dispense；
        库存不足 → INSUFFICIENT_STOCK（库存不变）。收费侧只拦不预扣（H09§3）。
        成功：有任一净发>0 → Order.status→PROC；行态 NONE→PARTIAL/FULL。
        部分发后剩余可再次 POST 至满发。幂等：Idempotency-Key 同键同体可重放。
      operationId: createDispense
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispenseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispenseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
