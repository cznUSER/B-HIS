openapi: 3.0.3
info:
  title: H Phase1 Outpatient Loop API
  version: 0.3.10-draft
  description: |
    P1-H03-MASTER 契约定稿草案 v0.3.10（基础数据维护；对齐拍板#24 + H02《基础数据字段清单》+ H09《基础数据-药品目录与库存口径》）。
    挂号六态、开单四态、发药/退药、Square Abate+新单、CanBack、卡状态已对齐。
    实现基线：Go API（可桌面 Host 托管）+ SQL Server；Store 可切换。
    库存方案 A（真实扣减）；**收费只拦不预扣**；发药 DISPENSE / 退药 RETURN / 维护 ADJUST 共写同一 qty_on_hand（≥0）。
    Auth：JWT HS256 access token（默认 TTL 8h）；login/logout/me 供 H04+H05 登录页落地。
    拍板#24：科室/医生/目录/库存总量调整/轻量字典/轻量用户；种子 dept-1/2、doc-1/2、DRUG-A/B、TREAT-1 可维护。
    H09：仅 DRUG 有 inventory_item；新建 DRUG 须建库存行（qty 可 0）；TREAT 不入；期初/盘盈盘亏均 biz_type=ADJUST（不新造 INIT）；ledger 只追加。
    v0.3.10/P1-H03-MASTER：departments/doctors/catalog-items/inventory adjust/dicts/users；迁移 008_master；
    错误码 DEPT_CODE_DUPLICATE、DOCTOR_*、ITEM_NO_DUPLICATE、ADJUST_RESULT_NEGATIVE、USERNAME_DUPLICATE 等；
    权限 inventory:adjust + admin:*；审计 inventory.adjust；contractVersion≡info.version（见 GET /health）。
    v0.3.9/P1-H03-DISPENSE：dispenses + inventory GET；006+007。v0.3.8 CHARGE；v0.3.7 ORDER；v0.3.6 挂号；v0.3.5 患者。
    旧 /encounters* 保留为 deprecated alias；POST /orders/{id}/dispense 为发药便捷别名。
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Patients
  - name: Registers
    description: |
      挂号单（RegisterBill）。域内 Encounter ≡ RegisterBill；API 主路径 /registers。
      订单/收费字段名可继续用 encounterId（语义 ≡ registerId）。
  - name: Encounters
    description: Deprecated alias of Registers；请改用 /registers。
  - name: Orders
    description: |
      门诊处方（order_sheet + order_item）。主字段 registerId（encounterId≡registerId）。
      状态主路径 SAVE→COMMIT→（收费后）PROC；作废 ABATE 仅未收费。
      拍板#21：强制有效挂号；save+commit；多处方；诊断不强制；毒麻关；审核一期跳过。
  - name: Charges
    description: |
      门诊结算（charge + charge_item + payment）。主字段 registerId（encounterId≡registerId）。
      拍板#22：强制有效挂号；现金一次付清；F=0 主路径；默认不拆 1:1；全退 newSquare=null；
      实收=应收；收费拦库存；已发药须先退药。迁移 005_charge。
  - name: Dispenses
    description: |
      门诊发药/退药（dispense + dispense_item）。拍板#23 + H02 发药字段清单 + H09 简易库存口径。
      主路径 POST /dispenses（须 Charge NORMAL+paid）；仅 DRUG；部分发；行态 NONE|PARTIAL|FULL。
      退药 POST /dispenses/{id}/return（reason+returnQty 必填）；退药后才能退费（REFUND_REQUIRES_RETURN）。
      迁移 007_dispense；库存扣减在发药事务（006_inventory）；收费不预扣。
  - name: Diagnoses
  - name: Inventory
    description: |
      方案 A 简易数量账（inventory_item / inventory_ledger）。GET /inventory/items；POST …/adjust（#24f）。
      item_no 对齐 catalog DRUG-A/B（≡ skuCode）；仅 DRUG；TREAT 不入库存。
      DISPENSE/RETURN/ADJUST 共写 qty_on_hand；迁移 006_inventory；维护面见 008_master。
  - name: Health
    description: 健康检查；contractVersion 对齐 info.version（0.3.10-draft）。
  - name: Departments
    description: |
      科室主数据维护（#24c）。CRUD + 启停；deptCode 过滤唯一；停用后不可新挂挂号/开单（DEPARTMENT_INACTIVE）。
      种子 dept-1/dept-2 可改。权限：SYSTEM / admin:*。
  - name: Doctors
    description: |
      医生主数据维护（#24d）。CRUD + 启停；归属科室；列表可 filter departmentId。
      种子 doc-1/doc-2 可改。权限：SYSTEM / admin:*。
  - name: Catalog
    description: |
      收费/药品目录（#24e / H09）。DRUG+TREAT；itemNo 唯一；改价仅影响之后开单。
      新建 DRUG 须同事务或紧随建 inventory_item（qty=0）；TREAT 不建库存。
      毒麻钩子 controlledFlag/isControlled 默认 false（隐藏）。种子 DRUG-A/B、TREAT-1 可改。
  - name: Dicts
    description: |
      轻量字典（#24g）。GET /dicts 汇总只读枚举 + 可维护码表；号别 register_sort 可维护。
      性别/证件/支付方式等只读枚举与现契约对齐；不做大字典引擎。
  - name: Users
    description: |
      轻量用户维护（#24h）。列表/新建/启停/可选重置演示口令；角色勾选预置 Role。
      完整 RBAC 矩阵延后 #24b。演示口令策略 per #15/#16（demo default passphrase）；OpenAPI 示例禁止明文生产秘密。
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录（匿名）；返回 JWT Bearer accessToken
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: AUTH_RATE_LIMITED（可选）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出；服务端使 token 失效（jti 黑名单或会话表）
      operationId: logout
      responses:
        '204':
          description: No Content
        '200':
          description: OK（允许返回 success 包络）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /auth/me:
    get:
      tags: [Auth]
      summary: 当前登录用户与角色
      operationId: me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: UNAUTHORIZED / TOKEN_EXPIRED / TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /patients:
    post:
      tags: [Patients]
      summary: 建档（证件/卡号冲突拒绝不合并）
      operationId: createPatient
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDto'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Patients]
      summary: 患者查询
      operationId: searchPatients
      parameters:
        - name: cardNo
          in: query
          schema: { type: string }
        - name: idNumber
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
        - name: hospPkNo
          in: query
          schema: { type: string }
        - name: address
          in: query
          description: 地址模糊（可选）
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientDto'
  /patients/{patientId}:
    get:
      tags: [Patients]
      summary: 患者详情
      operationId: getPatient
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDto'
        '404':
          $ref: '#/components/responses/NotFound'
  /registers:
    post:
      tags: [Registers]
      summary: 挂号（初始 status=NORMAL；拍板#19 科室+医生）
      description: |
        必填 patientId + departmentId + doctorId + visitDate。
        患者不存在 → 404 PATIENT_NOT_FOUND；科室/医生不存在 → 404 DEPARTMENT_NOT_FOUND / DOCTOR_NOT_FOUND。
        registerSort 可选占位；registerFee 默认 0；registerCharged 默认 false。
      operationId: createRegister
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '404':
          description: PATIENT_NOT_FOUND / DEPARTMENT_NOT_FOUND / DOCTOR_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Registers]
      summary: 挂号查询（按 patientId / registerNo）
      operationId: searchRegisters
      parameters:
        - name: patientId
          in: query
          schema: { type: string }
        - name: registerNo
          in: query
          schema: { type: string }
        - name: visitDate
          in: query
          description: 可选就诊日过滤
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegisterDto'
  /registers/{registerId}:
    get:
      tags: [Registers]
      summary: 挂号单详情
      operationId: getRegister
      parameters:
        - $ref: '#/components/parameters/RegisterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '404':
          $ref: '#/components/responses/NotFound'
  /registers/{registerId}/check-in:
    post:
      tags: [Registers]
      summary: 接诊 → DIAGNOSING（可延后实现）
      operationId: checkInRegister
      parameters:
        - $ref: '#/components/parameters/RegisterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /registers/{registerId}/complete:
    post:
      tags: [Registers]
      summary: 就诊完成 → DIAGNOSED（可延后实现）
      operationId: completeRegister
      parameters:
        - $ref: '#/components/parameters/RegisterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /registers/{registerId}/cancel:
    post:
      tags: [Registers]
      summary: 退号 → BACK（仅 NORMAL 可退；AC-03/AC-04）
      description: |
        默认仅 status=NORMAL → BACK；写 backOperatorId / backOperatedAt。
        USED / DIAGNOSING / DIAGNOSED / PAUSED → 409 REGISTER_NOT_CANCELLABLE。
        已 BACK → 409 REGISTER_BACK_NOT_ALLOWED（或 REGISTER_NOT_CANCELLABLE）。
        一期不允许退已用号（无开关 UI）。
      operationId: cancelRegister
      parameters:
        - $ref: '#/components/parameters/RegisterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          description: REGISTER_NOT_CANCELLABLE / REGISTER_BACK_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /encounters:
    post:
      tags: [Encounters]
      deprecated: true
      summary: "[deprecated] 请改用 POST /registers"
      description: |
        Deprecated alias。请求/响应 schema 与 /registers 相同（CreateRegisterRequest / RegisterDto）。
        encounterId ≡ registerId。
      operationId: createEncounter
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
  /encounters/{encounterId}/check-in:
    post:
      tags: [Encounters]
      deprecated: true
      summary: "[deprecated] 请改用 POST /registers/{registerId}/check-in"
      operationId: checkInEncounter
      parameters:
        - $ref: '#/components/parameters/EncounterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /encounters/{encounterId}/complete:
    post:
      tags: [Encounters]
      deprecated: true
      summary: "[deprecated] 请改用 POST /registers/{registerId}/complete"
      operationId: completeEncounter
      parameters:
        - $ref: '#/components/parameters/EncounterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /encounters/{encounterId}/cancel:
    post:
      tags: [Encounters]
      deprecated: true
      summary: "[deprecated] 请改用 POST /registers/{registerId}/cancel"
      operationId: cancelEncounter
      parameters:
        - $ref: '#/components/parameters/EncounterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /registers/{registerId}/diagnoses:
    post:
      tags: [Diagnoses]
      summary: 创建/保存诊断（可选最小实体；挂在 registerId）
      operationId: createDiagnoseOnRegister
      parameters:
        - $ref: '#/components/parameters/RegisterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiagnoseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnoseDto'
  /encounters/{encounterId}/diagnoses:
    post:
      tags: [Diagnoses]
      summary: 创建/保存诊断（可选最小实体）
      operationId: createDiagnose
      parameters:
        - $ref: '#/components/parameters/EncounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiagnoseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnoseDto'
  /diagnoses/{diagnoseId}/commit:
    post:
      tags: [Diagnoses]
      summary: 提交诊断
      operationId: commitDiagnose
      parameters:
        - name: diagnoseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnoseDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /diagnoses/{diagnoseId}/abate:
    post:
      tags: [Diagnoses]
      summary: 作废诊断
      operationId: abateDiagnose
      parameters:
        - name: diagnoseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnoseDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders:
    post:
      tags: [Orders]
      summary: 创建/暂存开单（status=SAVE；须有效挂号，否则 ENCOUNTER_REQUIRED）
      description: |
        创建一张门诊处方（暂存）。status 初始 SAVE，不可收费。
        **必填 registerId**（有效挂号且 status≠BACK）；无则 409 ENCOUNTER_REQUIRED（拍板#21a / O-P1）。
        encounterId 为同义别名（≡registerId）；若两者都传须一致。
        patientId / departmentId / doctorId 可选：服务端默认从挂号带出；doctorId 允许改（#21b）；
        若传入 patientId 须与挂号一致。diagnoseName 不强制（#21c）。
        items 可空（纯草稿）；提交(commit)时至少 1 行且 amount>0。
        一张挂号允许多张处方（#21d）。开单库存仅提示不拦（#21f）。
        毒麻精抗校验本版关闭（feature flag 默认 off）。无 Go handler（归 H04）。
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created（status=SAVE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '409':
          description: |
            ENCOUNTER_REQUIRED（无有效挂号/已退号 BACK）/
            CATALOG_ITEM_NOT_FOUND（可选）/
            ORDER_INVALID_AMOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    get:
      tags: [Orders]
      summary: 开单查询（按 registerId / patientId / status / orderNo）
      operationId: searchOrders
      parameters:
        - name: registerId
          in: query
          description: 挂号单 ID（≡encounterId）
          schema: { type: string }
        - name: encounterId
          in: query
          description: 同义别名 ≡ registerId（deprecated 字段名，语义相同）
          schema: { type: string }
          deprecated: true
        - name: patientId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [SAVE, COMMIT, PROC, ABATE]
        - name: orderNo
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderDto'
  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: 处方详情（头+明细）
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Orders]
      summary: 更新草稿（仅 SAVE；全量替换 items）
      description: |
        仅 status=SAVE 可改头/明细；否则 409 ORDER_NOT_EDITABLE。
        若请求体含 items，则 **全量替换** 明细行（按 lineNo）；省略 items 则仅改头字段。
        registerId 创建后不可改。
      operationId: patchOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchOrderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '409':
          description: ORDER_NOT_EDITABLE / ORDER_INVALID_AMOUNT / ENCOUNTER_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /orders/{orderId}/commit:
    post:
      tags: [Orders]
      summary: 提交开单 SAVE→COMMIT（提交后可收费）
      description: |
        前置：status=SAVE；至少 1 行明细；每行 amount>0；否则 ORDER_EMPTY_ITEMS / ORDER_INVALID_AMOUNT /
        ORDER_NOT_COMMITTABLE。
        成功：status=COMMIT；totalFee=Σ明细行 totalFee；写 submittedAt；可供收费载入。
        挂号仍须有效（≠BACK），否则 ENCOUNTER_REQUIRED。
        处方审核一期跳过（不经 RECIPE_CHECK）。
      operationId: commitOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK（status=COMMIT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '409':
          description: |
            ORDER_NOT_COMMITTABLE / ORDER_EMPTY_ITEMS / ORDER_INVALID_AMOUNT /
            ENCOUNTER_REQUIRED
          content:
            application/json:
