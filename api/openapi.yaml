      description: |
        停用后登录 → ACCOUNT_DISABLED（已有）。审计 user.update / user.deactivate。
        roles、roleScopes 和 permissionOverrides 是相互独立的完整集合字段：任一字段省略均保留该集合当前值；显式传 [] 清空该集合。
