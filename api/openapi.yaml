openapi: 3.0.3
info:
  title: H Phase1 Outpatient Loop API
  version: 0.3.11-draft
  description: |
    P2-H03 用户与权限契约草案 v0.3.11（在 v0.3.10 基础数据能力上增加用户角色多科室范围；保持拍板#24、H02 与 H09 已确认规则）。
    挂号六态、开单四态、发药/退药、Square Abate+新单、CanBack、卡状态已对齐。
    实现基线：Go API（可桌面 Host 托管）+ SQL Server；Store 可切换。
    库存方案 A（真实扣减）；**收费只拦不预扣**；发药 DISPENSE / 退药 RETURN / 维护 ADJUST 共写同一 qty_on_hand（≥0）。
    Auth：JWT HS256 access token（默认 TTL 8h）；login/logout/me 供 H04+H05 登录页落地。
    拍板#24：科室/医生/目录/库存总量调整/轻量字典；本契约扩展用户、角色、权限目录、模块/科室范围与用户级权限例外。
    v0.3.11/P2-0A：增加 user_role_scope 显式用户角色科室范围、集合字段省略兼容和即时有效科室授权检查；旧角色范围保持兼容。
    外观主题：新增医院主题与当前用户主题覆盖，服务端计算 effective；仅接受白名单色值、字体和字号档。
    H09：仅 DRUG 有 inventory_item；新建 DRUG 须建库存行（qty 可 0）；TREAT 不入；期初/盘盈盘亏均 biz_type=ADJUST（不新造 INIT）；ledger 只追加。
    v0.3.10/P1-H03-MASTER：departments/doctors/catalog-items/inventory adjust/dicts/users；迁移 008_master；
    错误码 DEPT_CODE_DUPLICATE、DOCTOR_*、ITEM_NO_DUPLICATE、ADJUST_RESULT_NEGATIVE、USERNAME_DUPLICATE 等；
    权限 inventory:adjust + admin:*；审计 inventory.adjust；contractVersion≡info.version（见 GET /health）。
    v0.3.9/P1-H03-DISPENSE：dispenses + inventory GET；006+007。v0.3.8 CHARGE；v0.3.7 ORDER；v0.3.6 挂号；v0.3.5 患者。
    旧 /encounters* 保留为 deprecated alias；POST /orders/{id}/dispense 为发药便捷别名。
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Settings
    description: 医院级系统设置；外观主题写操作需 admin:*。
  - name: Workbench
    description: |
      工作台汇总指标；只返回已授权科室范围内的聚合值，不返回患者或就诊明细。
      TODAY/YESTERDAY/WEEK/MONTH 按 Asia/Shanghai 自然日计算；待收费与待发药为当前待办快照。
  - name: Patients
  - name: Registers
    description: |
      挂号单（RegisterBill）。域内 Encounter ≡ RegisterBill；API 主路径 /registers。
      订单/收费字段名可继续用 encounterId（语义 ≡ registerId）。
  - name: Encounters
    description: Deprecated alias of Registers；请改用 /registers。
  - name: Orders
    description: |
      门诊处方（order_sheet + order_item）。主字段 registerId（encounterId≡registerId）。
      状态主路径 SAVE→COMMIT→（收费后）PROC；作废 ABATE 仅未收费。
      拍板#21：强制有效挂号；save+commit；多处方；诊断不强制；毒麻关；审核一期跳过。
  - name: Charges
    description: |
      门诊结算（charge + charge_item + payment）。主字段 registerId（encounterId≡registerId）。
      拍板#22：强制有效挂号；现金一次付清；F=0 主路径；默认不拆 1:1；全退 newSquare=null；
      实收=应收；收费拦库存；已发药须先退药。迁移 005_charge。
  - name: Dispenses
    description: |
      门诊发药/退药（dispense + dispense_item）。拍板#23 + H02 发药字段清单 + H09 简易库存口径。
      主路径 POST /dispenses（须 Charge NORMAL+paid）；仅 DRUG；部分发；行态 NONE|PARTIAL|FULL。
      退药 POST /dispenses/{id}/return（reason+returnQty 必填）；退药后才能退费（REFUND_REQUIRES_RETURN）。
      迁移 007_dispense；库存扣减在发药事务（006_inventory）；收费不预扣。
  - name: Diagnoses
  - name: Inventory
    description: |
      方案 A 简易数量账（inventory_item / inventory_ledger）。GET /inventory/items；POST …/adjust（#24f）。
      item_no 对齐 catalog DRUG-A/B（≡ skuCode）；仅 DRUG；TREAT 不入库存。
      DISPENSE/RETURN/ADJUST 共写 qty_on_hand；迁移 006_inventory；维护面见 008_master。
  - name: Health
    description: 健康检查；contractVersion 对齐 info.version（0.3.11-draft）。
  - name: Departments
    description: |
      科室主数据维护（#24c）。CRUD + 启停；deptCode 过滤唯一；停用后不可新挂挂号/开单（DEPARTMENT_INACTIVE）。
      种子 dept-1/dept-2 可改。权限：SYSTEM / admin:*。
  - name: Doctors
    description: |
      医生主数据维护（#24d）。CRUD + 启停；归属科室；列表可 filter departmentId。
      种子 doc-1/doc-2 可改。权限：SYSTEM / admin:*。
  - name: Catalog
    description: |
      收费/药品目录（#24e / H09）。DRUG+TREAT；itemNo 唯一；改价仅影响之后开单。
      新建 DRUG 须同事务或紧随建 inventory_item（qty=0）；TREAT 不建库存。
      毒麻钩子 controlledFlag/isControlled 默认 false（隐藏）。种子 DRUG-A/B、TREAT-1 可改。
  - name: Dicts
    description: |
      轻量字典（#24g）。GET /dicts 汇总只读枚举 + 可维护码表；号别 register_sort 可维护。
      性别/证件/支付方式等只读枚举与现契约对齐；不做大字典引擎。
  - name: Users
    description: |
      用户生命周期、角色、模块、科室范围、权限目录、用户级 ALLOW/DENY 例外及审计。
      旧 role/user_role 维持标准角色兼容；演示默认口令不在响应与日志回显。临床二次认证仅保存配置并保持关闭。
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录（匿名）；返回 JWT Bearer accessToken
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: AUTH_RATE_LIMITED（可选）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出；服务端使 token 失效（jti 黑名单或会话表）
      operationId: logout
      responses:
        '204':
          description: No Content
  /auth/change-password:
    post:
      tags: [Auth]
      summary: 完成管理员重置后的强制改密
      description: 只允许 `mustChangePassword=true` 的当前用户；成功后旧 access token 失效。
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password changed; issue a new login token
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '428':
          description: PASSWORD_CHANGE_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /auth/me/change-password:
    post:
      tags: [Auth]
      summary: 当前用户主动修改密码
      description: 成功后撤销旧 access token，客户端必须重新登录；不新增固定密码长度要求，沿用服务端现有密码策略。
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password changed; issue a new login token
        '400':
          description: VALIDATION_ERROR / CURRENT_PASSWORD_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '403':
          description: PASSWORD_CHANGE_NOT_ALLOWED / ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '428':
          description: PASSWORD_CHANGE_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: USER_AUDIT_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /auth/me:
    get:
      tags: [Auth]
      summary: 当前登录用户与角色
      description: |
        返回当前请求时解析的有效权限范围；`user.scopes` 是有效范围摘要，不是管理员可编辑的 `roleScopes` 明细。显式用户角色范围与旧角色默认范围按同一兼容规则解析，当前停用科室不产生有效范围。
      operationId: me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: UNAUTHORIZED / TOKEN_EXPIRED / TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      tags: [Auth]
      summary: 修改当前用户显示名
      description: 仅允许提交 displayName；角色、权限、科室范围和账号状态由管理员维护。
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMyProfileRequest' }
      responses:
        '200':
          description: Updated current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDto' }
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '403':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: USER_AUDIT_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /auth/me/preferences:
    get:
      tags: [Auth]
      summary: 获取当前用户工作偏好
      operationId: getMyPreferences
      responses:
        '200':
          description: Current preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '403':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    put:
      tags: [Auth]
      summary: 保存当前用户工作偏好
      description: 偏好只影响界面展示和默认进入页面，不改变业务权限、收费、发药或临床规则。
      operationId: updateMyPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferences' }
      responses:
        '200':
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '403':
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: USER_AUDIT_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /appearance/effective:
    get:
      tags: [Auth]
      summary: 获取当前用户实际生效的外观主题
      operationId: getEffectiveAppearance
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Server-resolved hospital or personal theme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveAppearance' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /settings/appearance:
    get:
      tags: [Settings]
      summary: 获取医院外观主题
      operationId: getHospitalAppearance
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Hospital theme and force setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HospitalAppearance' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '403':
          description: Permission denied; requires admin:*
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    put:
      tags: [Settings]
      summary: 保存医院外观主题
      operationId: updateHospitalAppearance
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HospitalAppearanceRequest' }
      responses:
        '200':
          description: Saved hospital theme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HospitalAppearance' }
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '403':
          description: Permission denied; requires admin:*
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: USER_AUDIT_UNAVAILABLE; mutation rolled back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /auth/me/appearance:
    get:
      tags: [Auth]
      summary: 获取当前用户个人外观覆盖
      operationId: getMyAppearance
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Personal override and editability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyAppearance' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    put:
      tags: [Auth]
      summary: 保存当前用户个人外观覆盖
      operationId: updateMyAppearance
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MyAppearanceRequest' }
      responses:
        '200':
          description: Saved personal override
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyAppearance' }
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '403':
          description: FORCED_HOSPITAL_THEME when hospital theme is forced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: USER_AUDIT_UNAVAILABLE; mutation rolled back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    delete:
      tags: [Auth]
      summary: 清除当前用户个人外观覆盖
      operationId: resetMyAppearance
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Personal theme cleared; follows hospital theme
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '403':
          description: FORCED_HOSPITAL_THEME when hospital theme is forced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: USER_AUDIT_UNAVAILABLE; mutation rolled back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /workbench/summary:
    get:
      tags: [Workbench]
      summary: 获取当前账号可见的工作台汇总
      description: |
        收费金额、退费金额、收费笔数按支付时间统计；门诊人次按挂号创建时间统计并排除已退号。
        平均客单价为收费金额 ÷ 门诊人次。待收费和待发药为当前快照，不受所选周期影响。
        各指标仅统计当前账号可见科室；available 标记当前账号是否能查看对应指标组。
      operationId: getWorkbenchSummary
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, enum: [TODAY, YESTERDAY, WEEK, MONTH] }
      responses:
        '200':
          description: 聚合汇总；无个体患者数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401':
          description: UNAUTHORIZED / TOKEN_INVALID / TOKEN_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '501':
          description: DASHBOARD_UNSUPPORTED（当前数据库驱动尚未实现聚合查询）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /patients:
    post:
      tags: [Patients]
      summary: 建档（证件/卡号冲突拒绝不合并）
      operationId: createPatient
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDto'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Patients]
      summary: 患者查询
      operationId: searchPatients
      description: |
        返回未删除患者档案，结果按 `created_at ASC, patient_id ASC` 固定排序。
        `offset` 从 0 开始；`limit` 默认为 100，允许 1-100。分页查询不会因排序字段相同而重复或遗漏记录。
      parameters:
        - name: patientNo
          in: query
          description: 患者号精确匹配
          schema: { type: string }
        - name: cardNo
          in: query
          schema: { type: string }
        - name: idNumber
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
        - name: hospPkNo
          in: query
          schema: { type: string }
        - name: address
          in: query
          description: 地址模糊（可选）
          schema: { type: string }
        - name: offset
          in: query
          description: 患者档案分页位置，从 0 开始
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: 每页记录数，默认 100，最大 100
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, nextOffset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientDto'
                  total:
                    type: integer
                    minimum: 0
                    nullable: true
                    description: 匹配条件下的未删除患者总数；旧适配器暂不支持计数时为 null
                  nextOffset:
                    type: integer
                    minimum: 0
                    nullable: true
                    description: 下一页 offset；无更多记录时为 null
        '400':
          description: offset 或 limit 不合法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /patients/registration-search:
    post:
      tags: [Patients]
      summary: 挂号患者候选查询
      description: |-
        只读查询挂号患者候选。请求体不写入访问日志；响应使用 Cache-Control: no-store。
        keyword 为空时返回全部未删除患者，非空时按姓名、电话、证件号或姓名助记码做 OR 字面子串匹配；每页最多 50 条。
        仅 ACTIVE 的 selectable 为 true；INACTIVE 记录仍可显示。该标志不是挂号授权。
        022 未应用或姓名助记码回填未完成时返回通用 503。
      operationId: searchRegistrationPatients
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                keyword:
                  type: string
                  maxLength: 64
                  description: 服务端按 Unicode code point（Go rune）计数校验，最多 64 个。
                offset: { type: integer, minimum: 0, default: 0 }
                limit: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        '200':
          description: 候选患者页；电话和证件号已掩码，响应不可缓存
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [items, total, nextOffset]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [patientId, patientNo, name, sex, idType, idNumberMasked, phoneMasked, status, selectable]
                      properties:
                        patientId: { type: string }
                        patientNo: { type: string }
                        name: { type: string }
                        sex: { type: string, enum: [M, F, U] }
                        idType: { type: string }
                        idNumberMasked: { type: string }
                        phoneMasked: { type: string }
                        status: { type: string, enum: [ACTIVE, INACTIVE] }
                        selectable: { type: boolean }
                  total: { type: integer, minimum: 0 }
                  nextOffset: { type: integer, minimum: 0, nullable: true }
        '400':
          description: keyword、offset 或 limit 不合法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '428':
          description: PASSWORD_CHANGE_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: 患者助记码搜索暂不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /patients/{patientId}:
