      description: |
        username/loginName 唯一 → USERNAME_DUPLICATE。
        新建默认演示口令策略「demo default passphrase per #15/#16」（契约写策略；**禁止**在 SQL/OpenAPI 示例写入可利用的明文生产秘密）。
        可使用已配置的标准或自定义角色代码；角色必须来自权限目录。
        roleScopes 可省略（新用户不写显式范围，按角色旧 moduleCode/departmentId 兼容授权）；传入时作为完整显式范围集合保存。
        角色、roleScopes、permissionOverrides 和成功审计在同一事务中提交。
        权限 SYSTEM / admin:*。审计 user.create。
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminDto'
        '409':
          description: USERNAME_DUPLICATE / ROLE_SCOPE_CONFLICT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '400':
          description: VALIDATION_ERROR（字段错误见 error.details.fields）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: USER_AUDIT_UNAVAILABLE / USER_ADMIN_BUSY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
