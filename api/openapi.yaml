  /dispenses/{dispenseId}/return:
    post:
      tags: [Dispenses]
      summary: 退药（reason + returnQty 必填；事务回加库存）
      description: |
        拍板#23f + H02§5 + H09。reason **必填**（空 → RETURN_REASON_REQUIRED / VALIDATION_ERROR）。
        items[].returnQty：0 < qty ≤ 本行可退（qty_dispensed−qty_returned）；超额 → RETURN_EXCEEDS_DISPENSE。
        未发却退 → NOT_DISPENSED。
        **同事务**：回加 qty_on_hand → ledger(RETURN,正) → 更新 qty_returned / 头 status。
        退药成功后对该明细退费不再 REFUND_REQUIRES_RETURN；未退完净发>0 的明细退费仍拒。
        Order：一期 DB 四态不扩 RECIPE_UNCHECK；权威退费前置以**行净发数量**判定（全退净发=0 即可退费）。
        毒麻本版不拦（#23g）。
      operationId: returnDispense
      parameters:
        - $ref: '#/components/parameters/DispenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
