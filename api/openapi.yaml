components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Phase1 默认 JWT access token（HS256）。
        Header: Authorization: Bearer <accessToken>
        TTL 默认 8h，可配置。refresh 延后。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
    PatientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegisterId:
      name: registerId
      in: path
      required: true
      description: 挂号单 ID（≡ encounterId）
      schema: { type: string, format: uuid }
    EncounterId:
      name: encounterId
      in: path
      required: true
      description: Deprecated 路径参数；语义 ≡ registerId
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChargeId:
      name: chargeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DispenseId:
      name: dispenseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema: { type: string }
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema: { type: string }
    CatalogItemId:
      name: catalogItemId
      in: path
      required: true
      schema: { type: string }
    SkuId:
      name: skuId
      in: path
      required: true
      description: inventory_item.sku_id
      schema: { type: string }
    DictType:
      name: dictType
      in: path
      required: true
      description: 如 register_sort
      schema: { type: string }
    DictItemId:
      name: dictItemId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    BadRequest:
      description: |
        Validation / invalid amount.
        常见 code: VALIDATION_ERROR, INVALID_AMOUNT（对齐 H08）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: |
        Conflict / illegal state / business rule（对齐 H08 错误码清单）。
        常见 code: DUPLICATE_PATIENT, REGISTER_NOT_CANCELLABLE,
        REGISTER_BACK_NOT_ALLOWED, PATIENT_NOT_FOUND, DEPARTMENT_NOT_FOUND,
        DOCTOR_NOT_FOUND, DOCTOR_DEPARTMENT_MISMATCH, ENCOUNTER_REQUIRED（已确认：收费/开单须有效挂号，退号 BACK 拒开）,
        ORDER_EMPTY_ITEMS, ORDER_INVALID_AMOUNT, ORDER_NOT_EDITABLE,
        ORDER_NOT_COMMITTABLE, ORDER_CHARGED_NOT_ABATABLE, CATALOG_ITEM_NOT_FOUND,
        ILLEGAL_STATE_TRANSITION, INSUFFICIENT_STOCK, ITEM_NOT_CAN_BACK,
        REFUND_REQUIRES_RETURN（已确认强制：已发药须先退药再退费）,
        REFUND_EXCEEDS_REFUNDABLE, CHARGE_AMOUNT_MISMATCH,
        NOT_CHARGED, ALREADY_ABATED, ALREADY_DISPENSED（≡H02 ALREADY_FULLY_DISPENSED）,
        DISPENSE_EXCEEDS_AVAILABLE, EMPTY_DISPENSE_ITEMS, NOT_DISPENSED,
        RETURN_EXCEEDS_DISPENSE, RETURN_REASON_REQUIRED,
        DEPT_CODE_DUPLICATE, DEPARTMENT_INACTIVE, DOCTOR_CODE_DUPLICATE, DOCTOR_INACTIVE,
        ITEM_NO_DUPLICATE, CATALOG_INACTIVE, INVALID_PRICE,
        ADJUST_RESULT_NEGATIVE, NOT_DRUG_SKU, USERNAME_DUPLICATE,
        ROLE_SCOPE_CONFLICT, LAST_SYSTEM_ADMIN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    DashboardSummary:
      type: object
      required: [period, rangeStart, rangeEnd, revenueCents, refundCents, netRevenueCents, chargeCount, refundCount, encounterCount, averageTicketCents, pendingChargeCount, pendingDispenseCount, available]
      properties:
        period: { type: string, enum: [TODAY, YESTERDAY, WEEK, MONTH] }
        rangeStart: { type: string, format: date-time, description: Asia/Shanghai 时间范围起点（包含） }
        rangeEnd: { type: string, format: date-time, description: Asia/Shanghai 时间范围终点（不包含） }
        revenueCents: { type: integer, format: int64, minimum: 0, description: 所选周期内成功收费金额，单位分 }
        refundCents: { type: integer, format: int64, minimum: 0, description: 所选周期内成功退费金额，单位分 }
        netRevenueCents: { type: integer, format: int64, description: 收费金额减退费金额，单位分 }
        chargeCount: { type: integer, minimum: 0, description: 所选周期内成功收费笔数 }
        refundCount: { type: integer, minimum: 0, description: 所选周期内成功退费笔数 }
        encounterCount: { type: integer, minimum: 0, description: 所选周期内未退号挂号人次 }
        averageTicketCents: { type: integer, format: int64, minimum: 0, description: 收费金额除以门诊人次，向下取整，单位分 }
        pendingChargeCount: { type: integer, minimum: 0, description: 当前待收费数量，不受周期筛选 }
        pendingDispenseCount: { type: integer, minimum: 0, description: 当前有未发药药品的已收费处方数，不受周期筛选 }
        available: { $ref: '#/components/schemas/DashboardAvailability' }
    DashboardAvailability:
      type: object
      required: [charges, encounters, dispenses]
      properties:
        charges: { type: boolean }
        encounters: { type: boolean }
        dispenses: { type: boolean }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, format: password }
    UserDto:
      type: object
      required: [id, username, displayName, roles, permissions, deniedPermissions, scopes, accessControlLoaded, system, super, developer, mustChangePassword, cannotModifyPassword, status, accountLocked]
      properties:
        id: { type: string, description: 用户主键 }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string }
          description: 角色代码，如 SYSTEM / REGISTRAR / DOCTOR / CASHIER / PHARMACIST 或已配置自定义角色
        permissions:
          type: array
          items: { type: string }
          description: 登录时的权限摘要；服务端请求授权每次重新读取存储
        deniedPermissions:
          type: array
          items: { type: string }
          description: 当前用户级 DENY 例外的权限代码摘要；仅用于前端展示与入口收口，服务端每次请求仍重新计算
        scopes:
          type: array
          items: { type: string }
          description: |
            当前有效授权范围摘要（兼容字段）。从每个角色的显式用户范围或旧角色默认范围解析；只包含 ACTIVE 范围，且每次服务端授权同时核对科室当前 ACTIVE 状态。不是可编辑配置值。权限变化在后续授权请求立即生效。
        accessControlLoaded:
          type: boolean
          description: 权限目录已成功加载并计算；为 false 时仅表示兼容的角色-only 响应，不得解释为空权限。
        system: { type: boolean }
        super: { type: boolean }
        developer: { type: boolean }
        permissionOverrides:
          type: array
          description: 用户与权限整屏提交时的完整权限例外集合；与用户资料、角色和成功审计同一事务保存。
          items: { $ref: '#/components/schemas/PermissionOverrideInput' }
        mustChangePassword: { type: boolean }
        cannotModifyPassword: { type: boolean }
        status: { type: string, enum: [ACTIVE, DISABLED, STOPPED] }
        accountLocked: { type: boolean }
    UpdateMyProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, description: 非空显示名，由服务端校验 }
    UserPreferences:
      type: object
      required: [density, sidebarCollapsed, defaultPage, pageSize]
      properties:
        density: { type: string, enum: [standard, compact] }
        sidebarCollapsed: { type: boolean }
        defaultPage: { type: string, enum: [home, workbench] }
        pageSize: { type: integer, enum: [10, 20, 50, 100] }
    ThemeTokens:
      type: object
      additionalProperties: false
      required: [sidebarBg, sidebarText, sidebarActive, surface, card, ink, muted, label, required, primary, primaryDeep, line, danger, ok, fontFamily, fontScale]
      properties:
        sidebarBg: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        sidebarText: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        sidebarActive: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        surface: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        card: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        ink: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        muted: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        label: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        required: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        primary: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        primaryDeep: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        line: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        danger: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        ok: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        fontFamily: { type: string, enum: [system, yahei, pingfang, noto] }
        fontScale: { type: number, format: float, enum: [0.9, 1.0, 1.1] }
    EffectiveAppearance:
      type: object
      required: [forceHospitalTheme, source, tokens, canEditPersonal]
      properties:
        forceHospitalTheme: { type: boolean }
        source: { type: string, enum: [hospital, personal] }
        tokens: { $ref: '#/components/schemas/ThemeTokens' }
        canEditPersonal: { type: boolean }
    HospitalAppearance:
      type: object
      required: [forceHospitalTheme, tokens, updatedAt, updatedBy]
      properties:
        forceHospitalTheme: { type: boolean }
        tokens: { $ref: '#/components/schemas/ThemeTokens' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    HospitalAppearanceRequest:
      type: object
      additionalProperties: false
      required: [forceHospitalTheme, tokens]
      properties:
        forceHospitalTheme: { type: boolean }
        tokens: { $ref: '#/components/schemas/ThemeTokens' }
    MyAppearance:
      type: object
      required: [hasOverride, tokens, forceHospitalTheme, canEditPersonal]
      properties:
        hasOverride: { type: boolean }
        tokens:
          oneOf:
            - $ref: '#/components/schemas/ThemeTokens'
            - type: 'null'
        forceHospitalTheme: { type: boolean }
        canEditPersonal: { type: boolean }
    MyAppearanceRequest:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens: { $ref: '#/components/schemas/ThemeTokens' }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, format: password }
        newPassword: { type: string, minLength: 1, format: password }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, description: JWT（HS256） }
        tokenType: { type: string, enum: [Bearer], example: Bearer }
        expiresIn: { type: integer, description: 秒；默认 28800（8h）可配置, example: 28800 }
        user:
          $ref: '#/components/schemas/UserDto'
    ErrorBody:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        requestId: { type: string }
    CreatePatientRequest:
      type: object
      required: [name, sex, idType, idNumber, phone, nationality]
      properties:
        name: { type: string, description: '姓名必填（H02 P-01 / 建档清单）' }
        sex: { type: string, enum: [M, F, U], description: '一期必填' }
        birthday: { type: string, format: date, description: '可填写；身份证类型且为空时服务端按证件号码推算，用户填写的日期会保留。必须 >1900-01-01 且 ≤今天' }
        idType: { type: string, description: '证件类型，必填' }
        idNumber: { type: string, description: '证件号码，必填；身份证类型须为有效日期格式。非空则查重，冲突 409 DUPLICATE_ID_NUMBER / DUPLICATE_PATIENT；拒绝不合并' }
        cardNo: { type: string, description: '选填；非空则查重，冲突 409 DUPLICATE_CARD_NO；拒绝不合并' }
        phone: { type: string, description: '手机号，必填' }
        address: { type: string, nullable: true, description: '选填可空（H02 建档清单）' }
        fareIdentity: { type: string, description: '费别，选填' }
        allergyHistory: { type: string, maxLength: 1000, description: '可选事实过敏史；空表示未记录，不表示无过敏；缺027迁移且非空写入返回503 SCHEMA_NOT_READY' }
        memberCardNo: { type: string, maxLength: 32 }
        memberLevel: { type: string, maxLength: 32 }
        contractUnit: { type: string, maxLength: 128 }
        patientCertificateNo: { type: string, maxLength: 32 }
        birthPlace: { type: string, maxLength: 128 }
        ethnicity: { type: string, maxLength: 32 }
        nationality: { type: string, maxLength: 32, description: '国籍，必填' }
        maritalStatus: { type: string, maxLength: 32 }
        occupationCategory: { type: string, maxLength: 64 }
        occupation: { type: string, maxLength: 128 }
        education: { type: string, maxLength: 32 }
        workUnit: { type: string, maxLength: 128 }
        workUnitPhone: { type: string, maxLength: 32 }
        workUnitPostcode: { type: string, maxLength: 16 }
        householdAddress: { type: string, maxLength: 256 }
        householdPhone: { type: string, maxLength: 32 }
        householdPostcode: { type: string, maxLength: 16 }
        contactName: { type: string, maxLength: 64 }
        contactAddress: { type: string, maxLength: 256 }
        contactPhone: { type: string, maxLength: 32 }
        contactRelation: { type: string, maxLength: 32 }
    PatientDto:
      type: object
      properties:
        patientId: { type: string, format: uuid, description: '契约侧 uuid 格式字符串；实现库存 varchar(64)' }
        hospPkNo: { type: string }
        patientNo: { type: string }
        cardNo: { type: string }
        name: { type: string }
        sex: { type: string }
        birthday: { type: string, format: date }
        idType: { type: string }
        idNumber: { type: string }
        phone: { type: string }
        address: { type: string, nullable: true }
        fareIdentity: { type: string }
        allergyHistory: { type: string, description: '已记录的过敏史；空表示未记录；旧库未迁移027时详情仍可读' }
        memberCardNo: { type: string }
        memberLevel: { type: string }
        contractUnit: { type: string }
        patientCertificateNo: { type: string }
        birthPlace: { type: string }
        ethnicity: { type: string }
        nationality: { type: string }
        maritalStatus: { type: string }
        occupationCategory: { type: string }
        occupation: { type: string }
        education: { type: string }
        workUnit: { type: string }
        workUnitPhone: { type: string }
        workUnitPostcode: { type: string }
        householdAddress: { type: string }
        householdPhone: { type: string }
        householdPostcode: { type: string }
        contactName: { type: string }
        contactAddress: { type: string }
        contactPhone: { type: string }
        contactRelation: { type: string }
        cardStatus:
          type: string
          enum: [NOT_SENT, NORMAL, LOST, CANCELLED]
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
    RegisterSlotBoardDto:
      type: object
      required: [visitDate, departments, doctors]
      properties:
        visitDate: { type: string, format: date }
        departments:
          type: array
          items:
            type: object
            required: [departmentId, departmentName, remainTotal]
            properties:
              departmentId: { type: string }
              departmentName: { type: string }
              remainTotal: { type: integer, nullable: true, minimum: 0 }
        doctors:
          type: array
          items:
            type: object
            required: [doctorId, departmentId, doctorName, scheduleConfigured, remain, slots]
            properties:
              doctorId: { type: string }
              departmentId: { type: string }
              doctorName: { type: string }
              scheduleConfigured: { type: boolean }
              remain: { type: integer, nullable: true, minimum: 0 }
              slots:
                type: array
                items:
                  type: object
                  required: [start, end, capacity, used, remain, period]
                  properties:
                    start: { type: string, format: date-time }
                    end: { type: string, format: date-time }
                    capacity: { type: integer, enum: [1] }
                    used: { type: integer, minimum: 0 }
                    remain: { type: integer, enum: [0, 1] }
                    period: { type: string, enum: [AM, PM] }
    CreateRegisterRequest:
      type: object
      required: [patientId, departmentId, doctorId, visitDate]
      description: |
        对齐 H02 挂号字段清单。现场号保持原流程；预约号可补充时间窗，服务端按医生检查重叠。
        registerSort 可选占位；registerFee 默认 0。
      properties:
        patientId: { type: string, format: uuid, description: '必填；不存在 → PATIENT_NOT_FOUND' }
        departmentId: { type: string, description: '必填；主数据科室 id（种子如 dept-1）；不存在 → DEPARTMENT_NOT_FOUND' }
        doctorId: { type: string, description: '必填；主数据医生 id（种子如 doc-1）；不存在 → DOCTOR_NOT_FOUND；必须属于所选科室，否则 DOCTOR_DEPARTMENT_MISMATCH' }
        visitDate: { type: string, format: date, description: '就诊日必填' }
        visitType: { type: string, enum: [WALK_IN, APPOINTMENT], default: WALK_IN, description: '现场号或预约号；省略时按是否提供预约时间自动推导' }
        appointmentStart: { type: string, format: date-time, nullable: true, description: '预约号及已配置排班医生必填；现场WALK_IN选格同样提交，与visitDate为同一上海日期，精确匹配单格起止' }
        appointmentEnd: { type: string, format: date-time, nullable: true, description: '预约结束时间；必须晚于开始时间且不超过 12 小时' }
        appointmentNote: { type: string, maxLength: 256, nullable: true, description: '预约备注' }
        registerSort: { type: string, nullable: true, description: '号别可选占位（如 sort-normal）；可空' }
        registerFee: { type: number, minimum: 0, description: '挂号费，单位元；大于 0 时通过 POST /registers/{registerId}/fee-charge 创建独立收费单，现金收费与全额退费复用 Charges 接口' }
    RegisterDto:
      type: object
      description: |
        挂号单 DTO。域内 Encounter ≡ RegisterBill。
        订单/收费若仍用 encounterId 字段名，语义 ≡ registerId。
      properties:
        registerId: { type: string, format: uuid, description: '≡ encounterId；实现库存 varchar(64)' }
        registerNo: { type: string, description: '挂号单号 UK' }
        patientId: { type: string, format: uuid }
        patientName: { type: string, description: '患者姓名；挂号列表返回，用于当日工作清单' }
        departmentId: { type: string }
        doctorId: { type: string }
        registerSort: { type: string, nullable: true }
        visitDate: { type: string, format: date }
        visitType: { type: string, enum: [WALK_IN, APPOINTMENT] }
        appointmentStart: { type: string, format: date-time, nullable: true }
        appointmentEnd: { type: string, format: date-time, nullable: true }
        appointmentNote: { type: string, nullable: true }
        status:
          type: string
          enum: [NORMAL, USED, BACK, DIAGNOSING, DIAGNOSED, PAUSED]
          description: 对齐 TRegisterStatus；创建默认 NORMAL
        registerFee: { type: number, minimum: 0, description: '挂号费，单位元；大于 0 时表示尚未收费或已收费的独立挂号费' }
        registerCharged: { type: boolean, description: '默认 false' }
        registeredAt: { type: string, format: date-time }
        backOperatorId: { type: string, nullable: true }
        backOperatedAt: { type: string, format: date-time, nullable: true }
    CreateEncounterRequest:
      allOf:
        - $ref: '#/components/schemas/CreateRegisterRequest'
      deprecated: true
      description: Deprecated alias of CreateRegisterRequest（encounterId≡registerId）
    EncounterDto:
      allOf:
        - $ref: '#/components/schemas/RegisterDto'
      deprecated: true
      description: |
        Deprecated alias of RegisterDto。
        兼容字段：若实现仍返回 encounterId/encounterNo/deptCode/clinicSort，
        分别对应 registerId/registerNo/departmentId/registerSort。
    CreateDiagnoseRequest:
      type: object
      properties:
        content: { type: string }
        structured:
          $ref: '#/components/schemas/StructuredDiagnose'
          description: 结构化诊疗栏目；服务端会兼容并回读旧 content 文本
        templateCode: { type: string, maxLength: 32, default: GENERAL, description: 记录模板编码 }
    AmendDiagnoseRequest:
      type: object
      required: [revisionReason]
      properties:
        content: { type: string }
        structured:
          $ref: '#/components/schemas/StructuredDiagnose'
        templateCode: { type: string, maxLength: 32, description: 修订后病历模板编码；省略时沿用原版本 }
        revisionReason: { type: string, minLength: 1, maxLength: 256, description: 修订原因；只允许从已提交版本发起修订 }
    DiagnoseDto:
      type: object
      properties:
        diagnoseId: { type: string, format: uuid }
        encounterId: { type: string, format: uuid, description: '≡ registerId' }
        status: { type: string, enum: [NEW, SAVE, COMMIT, ABATE] }
        content: { type: string }
        structured:
          $ref: '#/components/schemas/StructuredDiagnose'
        templateCode: { type: string }
        version: { type: integer, minimum: 1, description: 当前挂号下的病历版本序号 }
        supersedesDiagnoseId: { type: string, format: uuid, nullable: true, description: 本版本直接修订的前一条诊断记录 }
        revisionReason: { type: string, nullable: true, description: 发起修订时填写的原因 }
        signedAt: { type: string, format: date-time, nullable: true, description: 提交签名时间 }
        signedBy: { type: string, nullable: true, description: 提交签名操作员 }
    StructuredDiagnose:
      type: object
      description: 一期电子病历结构化栏目；每项建议不超过 320 个字符
      properties:
        chiefComplaint: { type: string, description: 主诉 }
        presentHistory: { type: string, description: 现病史 }
        pastHistory: { type: string, description: 既往史与过敏史 }
        examination: { type: string, description: 查体与检查 }
        assessment: { type: string, description: 初步诊断 }
        plan: { type: string, description: 处置计划 }
    OrderItemInput:
      type: object
      required: [itemNo, itemType, itemName, amount, price]
      properties:
        lineNo: { type: integer, description: 行号；创建时可省略由服务端按序生成（从 1） }
        itemNo: { type: string, description: 目录编码（如 DRUG-A / TREAT-1） }
        itemType: { type: string, enum: [DRUG, TREAT], description: '药品 DRUG / 治疗 TREAT（一期；原 SERVICE 改为 TREAT）' }
        itemName: { type: string }
        spec: { type: string, nullable: true, description: 规格（目录带出） }
        units: { type: string, description: 单位（目录带出；原 unit 字段更名为 units） }
        amount: { type: number, description: '数量；须 > 0（提交时强制；暂存建议亦 >0）' }
        price: { type: number, description: '单价；≥ 0' }
        totalFee: { type: number, description: '行金额；可省略由服务端 round2(amount*price)' }
        usageText: { type: string, nullable: true, description: 用法文案（选填） }
        frequencyText: { type: string, nullable: true, description: 频次文案（选填） }
        dosage: { type: string, nullable: true }
        dosageUnit: { type: string, nullable: true }
        procDepartmentId: { type: string, nullable: true, description: 执行科室（选填） }
    CreateOrderRequest:
      type: object
      required: [registerId]
      description: |
        创建/暂存。registerId 必填且须有效（status≠BACK）。
        encounterId 为同义别名；若同时传入须与 registerId 一致。
        items 可空（纯草稿）；commit 时至少 1 行。
      properties:
        registerId:
          type: string
          format: uuid
          description: '挂号单 ID；须有效且 status≠BACK，否则 ENCOUNTER_REQUIRED（#21a）'
        encounterId:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: '≡ registerId（别名）；优先用 registerId'
        patientId:
          type: string
          format: uuid
          nullable: true
          description: '可选；默认从挂号带出；若传须与挂号 patientId 一致'
        departmentId:
          type: string
          format: uuid
          nullable: true
          description: '开单科室；默认挂号科室'
        doctorId:
          type: string
          format: uuid
          nullable: true
          description: '开单医生；默认=挂号医生，允许改（#21b）'
        diagnoseName:
          type: string
          nullable: true
          description: '诊断简述；不强制（#21c）；UI 鼓励填写'
        recipeSort:
          type: string
          nullable: true
          description: '处方类别；默认 NORMAL；毒麻精抗权校验本版关闭（feature flag 默认 off）'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
          description: 明细；创建时可空；commit 至少 1 行
    PatchOrderRequest:
      type: object
      description: |
        仅 SAVE 可 PATCH。含 items 时全量替换明细；省略 items 则只改头。
        不可改 registerId。
      properties:
        patientId: { type: string, format: uuid, nullable: true }
        departmentId: { type: string, format: uuid, nullable: true }
        doctorId: { type: string, format: uuid, nullable: true, description: 允许改开单医生 }
        diagnoseName: { type: string, nullable: true }
        recipeSort: { type: string, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
          description: 若出现则全量替换明细行
    OrderItemDto:
      allOf:
        - $ref: '#/components/schemas/OrderItemInput'
        - type: object
          required: [orderItemId, totalFee]
          properties:
            orderItemId: { type: string, format: uuid }
            totalFee: { type: number, description: '行金额 round2(amount*price)' }
    OrderDto:
      type: object
      required: [orderId, orderNo, registerId, patientId, departmentId, doctorId, status, totalFee, charged]
      properties:
        orderId: { type: string, format: uuid }
        orderNo: { type: string, description: 系统生成处方号 }
        registerId:
          type: string
          format: uuid
          description: '挂号单 ID（主字段）'
        encounterId:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: '≡ registerId（别名，响应可同时返回）'
        patientId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        diagnoseName: { type: string, nullable: true }
        recipeSort: { type: string, nullable: true, description: 默认 NORMAL }
        status:
          type: string
          enum: [SAVE, COMMIT, PROC, ABATE]
          description: |
            一期四态（拍板#21 / 004_order CHECK）。
            SAVE=暂存不可收费；COMMIT=已提交可收费；PROC=发药执行；ABATE=作废终态。
            RECIPE_CHECK 等 CureBill 扩展态一期跳过（不入库 CHECK）。
        totalFee: { type: number, description: 'Σ明细；commit 时强制重算' }
        charged: { type: boolean, description: '是否已收费；true 时不可 abate' }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'
        submittedAt: { type: string, format: date-time, nullable: true }
        abatedAt: { type: string, format: date-time, nullable: true }
        abatedBy: { type: string, nullable: true }
    ChargeItemDto:
      type: object
      required: [chargeItemId, lineNo, itemNo, itemName, qty, unitPrice, totalFee, canBack]
      properties:
        chargeItemId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid, nullable: true }
        lineNo: { type: integer }
        itemNo: { type: string }
        itemName: { type: string }
        qty:
          type: number
          description: '收费数量；须 >0（C-02）。API 亦可用 amount 别名（实现择一，契约主字段 qty）'
        unitPrice:
          type: number
          description: '单价。API 亦可用 price 别名'
        totalFee: { type: number }
        canBack: { type: boolean, description: '可退标记；false → ITEM_NOT_CAN_BACK' }
        refundedQty: { type: number, description: '已退数量；默认 0；≤qty' }
    ChargeDto:
      type: object
      required: [chargeId, squareNo, registerId, patientId, totalFee, squareFee, favourableFee, status]
      description: |
        结算单（Square）。主字段 registerId；encounterId≡registerId 别名。
        拍板#22a：无有效挂号不可创建/支付 → ENCOUNTER_REQUIRED。
      properties:
        chargeId: { type: string, format: uuid }
        squareNo: { type: string }
        orderId: { type: string, format: uuid, nullable: true, description: 'Phase1 主路径有值；可空策略允许多来源' }
        registerId:
          type: string
          format: uuid
          description: '挂号单 ID（主字段，必填）；≡ encounterId'
        encounterId:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: '≡ registerId（别名）；响应可同时返回'
        patientId: { type: string, format: uuid }
        totalFee: { type: number, description: '毛额 G；F=0 时与 squareFee 同（K-01/K-02）' }
        squareFee: { type: number, description: '应收 R = G - F' }
        favourableFee: { type: number, description: '整单优惠 F；Phase1 验收主路径 0（#22c）' }
        status:
          type: string
          enum: [NORMAL, ABATE]
          description: 对齐 TSquareStatus / H08
        successorChargeId:
          type: string
          format: uuid
          nullable: true
          description: '作废后生成的新单（未退部分）；全退为 null。旧名 successorSquareId 弃用'
        abatedFromId:
          type: string
          format: uuid
          nullable: true
          description: 若本单由退费生成，指向被作废原单
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChargeItemDto'
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: '支付成功时间；待收为 null'
    PayRequest:
      type: object
      required: [payType, amount]
      description: |
        拍板#22b/22f：现金一次付清；amount 必须等于 Charge.squareFee（实收=应收，不允许多收找零）。
        服务端当前只接受 CASH；电子支付枚举仅预留，提交时会被拒绝。
      properties:
        paymentNo: { type: string, nullable: true, description: '可选；省略由服务端生成' }
        payType:
          type: string
          enum: [CASH]
          description: |
            当前仅允许现金。OTHER_E/WECHAT/ALIPAY/OTHER 为预留代码，服务端暂不接受。
        amount:
          type: number
          description: '必须 = squareFee；否则 CHARGE_AMOUNT_MISMATCH / INVALID_AMOUNT'
    FavourableAlloc:
      type: string
      enum: [PROPORTIONAL]
      default: PROPORTIONAL
      description: |
        目前只接受 PROPORTIONAL；含优惠收费单的部分退费暂不支持，整单退费不需要拆分优惠。
    RefundRequest:
      type: object
      required: [payType, items]
      description: |
        对齐 H08 交接 §1.4 + 拍板#22。
        前置：Square=NORMAL；已发药明细必须先退药成功，否则 409 REFUND_REQUIRES_RETURN（#22h / B-08）。
        全退：不生成金额为 0 的新 Square → newSquare=null（#22e）。仅 CASH 退回；含优惠收费单部分退费返回 409 PARTIAL_REFUND_DISCOUNT_UNSUPPORTED。
      properties:
        reason: { type: string, description: '退费原因；建议填写' }
        payType:
          type: string
          enum: [CASH]
          description: 当前只支持现金；电子支付方式为预留代码且服务端拒绝
        favourableAlloc:
          $ref: '#/components/schemas/FavourableAlloc'
        items:
          type: array
          items:
            type: object
            required: [chargeItemId, refundQty]
            properties:
              chargeItemId: { type: string, format: uuid }
              refundQty:
                type: number
                description: |
                  部分数量退；须 ≤可退且 canBack。
                  已发药明细须先退药，否则 REFUND_REQUIRES_RETURN。
                  超额 → REFUND_EXCEEDS_REFUNDABLE；金额非法 → INVALID_AMOUNT。
    RefundResultDto:
      type: object
      required: [abatedCharge, refundPayment]
      description: |
        退费响应。全退时 newSquare 必须为 null（#22e）；部分退时 newSquare 为承接未退的新 NORMAL。
      properties:
        abatedCharge:
          $ref: '#/components/schemas/ChargeDto'
          description: '已作废原单（status=ABATE）'
        newSquare:
          allOf:
            - $ref: '#/components/schemas/ChargeDto'
          nullable: true
          description: '未退部分新 Square；**全退必须 null**（不生成金额 0 新单）'
        refundPayment:
          $ref: '#/components/schemas/PaymentDto'
    PaymentDto:
      type: object
      required: [paymentId, paymentNo, chargeId, direction, payType, amount, status]
      properties:
        paymentId: { type: string, format: uuid }
        paymentNo: { type: string }
        chargeId: { type: string, format: uuid }
        direction:
          type: string
          enum: [CHARGE, REFUND]
          description: 收费 CHARGE / 退款 REFUND（H08）
        payType:
          type: string
          enum: [CASH]
          description: 当前仅现金；电子支付方式为预留代码且服务端拒绝
        amount:
          type: number
          description: '≥0；收费时须 = squareFee；非法 → INVALID_AMOUNT'
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
          description: 支付/退费成功须为 SUCCEEDED（H08）；Phase1 成功写 SUCCEEDED
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: '成功时间（主字段）；succeededAt 为兼容别名'
        succeededAt:
          type: string
          format: date-time
          nullable: true
          deprecated: true
          description: '≡ paidAt（别名）'
    DispenseRequest:
      type: object
      required: [orderId, items]
      description: |
        确认发药。chargeId 主路径建议必填（可由 orderId 解析）；items 仅 DRUG。
        dispenseQty 默认=availableQty，可改小（部分发）。
      properties:
        orderId: { type: string, format: uuid }
        chargeId:
          type: string
          format: uuid
          description: 已支付 NORMAL Charge；缺省时由实现按 orderId 解析唯一有效单
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [dispenseQty]
            properties:
              orderItemId: { type: string, format: uuid }
              chargeItemId: { type: string, format: uuid, description: 与 orderItemId 至少填一 }
              dispenseQty:
                type: number
                description: 本次发药数量；0 < qty ≤ availableQty
              selected:
                type: boolean
                description: UI 勾选；服务端以 dispenseQty>0 为准
    ReturnDispenseRequest:
      type: object
      required: [reason, items]
      properties:
        reason:
          type: string
          minLength: 1
          description: 退药原因必填（B-05 / RETURN_REASON_REQUIRED）
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [dispenseItemId, returnQty]
            properties:
              dispenseItemId: { type: string, format: uuid }
              returnQty:
                type: number
                description: 退数量；0 < qty ≤ 可退（已发−已退）
    DispenseItemDto:
      type: object
      properties:
        dispenseItemId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid, nullable: true }
        chargeItemId: { type: string, format: uuid, nullable: true }
        itemNo: { type: string, description: 目录编码，仅 DRUG }
        itemName: { type: string }
        units: { type: string }
        chargedQty: { type: number, description: 已收费数量（快照） }
        dispensedQty: { type: number, description: 本单发药数量；聚合查询时可为净发累计 }
        returnedQty: { type: number, description: 本单已退数量 }
        availableQty:
          type: number
          description: chargedQty − 净发（净发=累计已发−累计已退）；待发载入用
        dispenseQty:
          type: number
          description: 本次请求发药数量（请求回显）
        stockHint:
          type: string
          description: 库存提示文案（不足标红）
        stockQty:
          type: number
          description: 当前 qty_on_hand（提示用）
        lineDispenseStatus:
          type: string
          enum: [NONE, PARTIAL, FULL]
          description: |
            相对收费行净发：NONE=净发0；PARTIAL=0<净发<charged；FULL=净发=charged
    DispenseDto:
      type: object
      required: [dispenseId, dispenseNo, orderId, status, items]
      properties:
        dispenseId: { type: string, format: uuid }
        dispenseNo: { type: string }
        orderId: { type: string, format: uuid }
        chargeId: { type: string, format: uuid, nullable: true }
        registerId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        status:
          type: string
          enum: [DONE, PARTIAL_RETURNED, RETURNED]
          description: 本发药单头状态（DONE=已记账；PARTIAL_RETURNED=部分退；RETURNED=本单净发0）
        orderStatus:
          type: string
          description: |
            权威处方状态。有净发→PROC。一期不扩 RECIPE_UNCHECK 入库；
            退费前置以行净发数量判定（净发>0 → REFUND_REQUIRES_RETURN）。
        returnReason: { type: string, nullable: true }
        operatorId: { type: string, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/DispenseItemDto'
        dispensedAt: { type: string, format: date-time }
    InventoryItemDto:
      type: object
      properties:
        skuId: { type: string, format: uuid }
        skuCode: { type: string, description: ≡ item_no（如 DRUG-A） }
        itemNo: { type: string, description: ≡ skuCode }
        name: { type: string }
        itemName: { type: string, description: ≡ name；冗余展示 }
        qtyOnHand: { type: number, description: 权威可用量；≥0 }
        units: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        rowVersion:
          type: string
          description: 乐观锁令牌（实现可将 rowversion 编为 base64/十进制字符串）
        updatedAt: { type: string, format: date-time }
    InventoryLedgerPageDto:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryLedgerDto' }
        nextCursor:
          type: string
          description: 空字符串表示最后一页
    InventoryLedgerDto:
      type: object
      required: [ledgerId, skuId, skuCode, bizType, qtyDelta, qtyAfter, createdAt]
      properties:
        ledgerId: { type: string }
        skuId: { type: string }
        skuCode: { type: string }
        bizType: { type: string, enum: [ADJUST, DISPENSE, RETURN] }
        bizId: { type: string }
        qtyDelta: { type: number, description: DISPENSE 为负、RETURN 为正、ADJUST 可正可负 }
        qtyAfter: { type: number, description: 流水发生后的结存，包含查询日期范围之前的流水 }
        remark: { type: string }
        operatorName: { type: string }
        createdAt: { type: string, format: date-time }
    InventoryBatchPageDto:
      type: object
      required: [items, summary, asOfDate, expiryWindowDays, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryBatchDto' }
        summary: { $ref: '#/components/schemas/InventoryBatchSummaryDto' }
        asOfDate: { type: string, format: date }
        expiryWindowDays: { type: integer, minimum: 0 }
        nextCursor: { type: string, description: 空字符串表示最后一页 }
    InventoryBatchSummaryDto:
      type: object
      required: [batchCount, qtyTotal, qtyUnknown, duplicateKeyCount]
      properties:
        batchCount: { type: integer, minimum: 0 }
        qtyTotal: { type: string, pattern: '^-?[0-9]+\\.[0-9]{3}$', description: decimal(18,3) 字符串，避免浮点精度损失 }
        qtyUnknown: { type: string, pattern: '^-?[0-9]+\\.[0-9]{3}$', description: decimal(18,3) 字符串 }
        duplicateKeyCount: { type: integer, minimum: 0 }
    InventoryBatchDto:
      type: object
      required: [batchId, skuId, itemNo, itemName, productDate, expireDate, qtyOnHand, units, expiryStatus]
      properties:
        batchId: { type: string }
        skuId: { type: string }
        itemNo: { type: string }
        itemName: { type: string }
        storageUnitId: { type: string, nullable: true }
        batchNo: { type: string, nullable: true }
        productNo: { type: string, nullable: true }
        supplierId: { type: string, nullable: true }
        productDate: { type: string, format: date, nullable: true }
        expireDate: { type: string, format: date, nullable: true }
        qtyOnHand: { type: string, pattern: '^-?[0-9]+\\.[0-9]{3}$', description: decimal(18,3) 字符串 }
        units: { type: string }
        sourceRef: { type: string, nullable: true }
        expiryStatus: { type: string, enum: [UNKNOWN, VALID, EXPIRING, EXPIRED] }
        rowVersion: { type: string, nullable: true }
    AdjustInventoryRequest:
      type: object
      required: [qtyDelta, remark]
      description: |
        qtyDelta 可负；结果 qtyOnHand+qtyDelta ≥0。remark 建议必填（期初/盘点/纠错）。
        biz_type 固定 ADJUST（不新造 INIT）。
      properties:
        qtyDelta: { type: number, description: 可正可负 }
        remark: { type: string, minLength: 1, description: 调整原因建议必填 }
        rowVersion:
          type: string
          description: 可选；携带则做乐观锁校验
    HealthDto:
      type: object
      required: [status, version, contractVersion, implementedVersion]
      properties:
        status: { type: string, enum: [ok], example: ok }
        contractVersion:
          type: string
          description: 对齐 info.version
          example: 0.3.11-draft
        version:
          type: string
          description: 实现版本兼容别名；与 implementedVersion 相同
          example: 0.3.11-draft
        implementedVersion:
          type: string
          description: 服务端实现版本；本契约对应实现应为 0.3.11-draft
          example: 0.3.11-draft
    DepartmentDto:
      type: object
      required: [departmentId, deptCode, deptName, status]
      properties:
        departmentId: { type: string }
        deptCode: { type: string }
        deptName: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortNo: { type: integer, description: 可选排序；默认 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDepartmentRequest:
      type: object
      required: [deptCode, deptName]
      properties:
        deptCode: { type: string, minLength: 1 }
        deptName: { type: string, minLength: 1 }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
        sortNo: { type: integer, default: 0 }
    PatchDepartmentRequest:
      type: object
      properties:
        deptCode: { type: string }
        deptName: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortNo: { type: integer }
    DoctorDto:
      type: object
      required: [doctorId, doctorCode, doctorName, departmentId, status, workingHours]
      properties:
        doctorId: { type: string }
        doctorCode: { type: string }
        doctorName: { type: string }
        departmentId: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        workingHours:
          type: array
          description: 每周本地接诊时段；weekday 采用 1=周一至 7=周日。为空表示尚未配置排班。
          items:
            $ref: '#/components/schemas/DoctorWorkingHour'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDoctorRequest:
      type: object
      required: [doctorCode, doctorName, departmentId]
      properties:
        doctorCode: { type: string, minLength: 1 }
        doctorName: { type: string, minLength: 1 }
        departmentId: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
        workingHours:
          type: array
          items:
            $ref: '#/components/schemas/DoctorWorkingHour'
    PatchDoctorRequest:
      type: object
      properties:
        doctorCode: { type: string }
        doctorName: { type: string }
        departmentId: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        workingHours:
          type: array
          items:
            $ref: '#/components/schemas/DoctorWorkingHour'
