      summary: 库存列表/查询（方案A；仅 DRUG）
      description: |
        方案 A 已拍板。返回 qtyOnHand / units / status / rowVersion（乐观锁基线，base64 或十进制字符串均可，实现自定）。
        过滤：skuCode/itemNo、status。TREAT 不在表内。
        发药/收费前可用于 stockHint；维护页列表同源。StatusOnly 实验降级可 501（非默认）。
      operationId: listInventory
      parameters:
        - name: skuCode
          in: query
          description: 即 item_no（如 DRUG-A）
          schema: { type: string }
        - name: itemNo
          in: query
          description: ≡ skuCode
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryItemDto'
        '501':
          description: StatusOnly mode（非 Phase1 默认）
  /inventory/items/{skuId}/adjust:
    post:
      tags: [Inventory]
      summary: 库存总量调整（期初/盘盈/盘亏 · #24f / H09）
      description: |
        同事务：更新 inventory_item.qty_on_hand + 追加 inventory_ledger（biz_type=**ADJUST**）。
        qtyDelta 可正可负；结果须 ≥0，否则 409 ADJUST_RESULT_NEGATIVE。
        期初/盘盈/盘亏**均**走 ADJUST + remark 区分；**不新造 INIT**（H09）。
        与发药 DISPENSE / 退药 RETURN 共写同一 qty_on_hand；ledger 只追加。
        可选乐观锁 rowVersion（若请求携带且冲突 → 409 CONFLICT / 条件更新失败）。
        TREAT 或无库存 SKU → 409 NOT_DRUG_SKU。
        权限：`inventory:adjust` 或 `admin:*`。审计 action **`inventory.adjust`**（#24f / H09 强制补列）。
        不足/负库存勿绕过；业务发药侧不足仍用 INSUFFICIENT_STOCK（本接口不发该码作成功路径）。
      operationId: adjustInventory
      parameters:
        - $ref: '#/components/parameters/SkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustInventoryRequest'
      responses:
        '200':
          description: OK（返回更新后库存行）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /dicts:
    get:
      tags: [Dicts]
      summary: 字典总览（只读枚举汇总 + 可维护码表类型）
      description: |
        返回系统只读枚举（性别/证件类型/支付方式等，与现契约对齐）+ 可维护 dictType 列表（本期 register_sort）。
        权限：已登录可读；维护写操作需 SYSTEM / admin:*。
      operationId: listDicts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictOverviewDto'
  /dicts/{dictType}/items:
    get:
      tags: [Dicts]
      summary: 某类型码表项列表
      operationId: listDictItems
      parameters:
        - $ref: '#/components/parameters/DictType'
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DictItemDto'
    post:
      tags: [Dicts]
      summary: 新建可维护码表项（如号别）
      description: |
        本期可维护至少 register_sort（种子 sort-normal）。只读枚举类型拒绝写入。
        审计 dict.create。权限 SYSTEM / admin:*。
      operationId: createDictItem
      parameters:
        - $ref: '#/components/parameters/DictType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDictItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictItemDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /dicts/{dictType}/items/{dictItemId}:
    patch:
      tags: [Dicts]
      summary: 更新码表项（含启停）
      operationId: patchDictItem
      parameters:
        - $ref: '#/components/parameters/DictType'
        - $ref: '#/components/parameters/DictItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDictItemRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictItemDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users:
    get:
      tags: [Users]
      summary: 用户列表（轻量）
      operationId: listUsers
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, DISABLED, INACTIVE] }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAdminDto'
    post:
      tags: [Users]
      summary: 新建用户（演示默认口令策略）
      description: |
        username/loginName 唯一 → USERNAME_DUPLICATE。
        新建默认演示口令策略「demo default passphrase per #15/#16」（契约写策略；**禁止**在 SQL/OpenAPI 示例写入可利用的明文生产秘密）。
        角色仅预置 registrar/doctor/cashier/pharmacist/SYSTEM；完整 RBAC 延后 #24b。
        权限 SYSTEM / admin:*。审计 user.create。
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{userId}:
    patch:
      tags: [Users]
      summary: 更新用户（含启停/显示名/角色）
      description: |
        停用后登录 → ACCOUNT_DISABLED（已有）。审计 user.update / user.deactivate。
      operationId: patchUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{userId}/reset-password:
    post:
      tags: [Users]
      summary: 重置为演示默认口令策略（可选）
      description: |
        重置为 demo default passphrase per #15/#16（实现哈希入库）。
        **响应与日志禁止回显明文口令**。审计 user.reset_password。权限 SYSTEM / admin:*。
      operationId: resetUserPassword
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Phase1 默认 JWT access token（HS256）。
        Header: Authorization: Bearer <accessToken>
        TTL 默认 8h，可配置。refresh 延后。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
    PatientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegisterId:
      name: registerId
      in: path
      required: true
      description: 挂号单 ID（≡ encounterId）
      schema: { type: string, format: uuid }
    EncounterId:
      name: encounterId
      in: path
      required: true
      description: Deprecated 路径参数；语义 ≡ registerId
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChargeId:
      name: chargeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DispenseId:
      name: dispenseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema: { type: string }
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema: { type: string }
    CatalogItemId:
      name: catalogItemId
      in: path
      required: true
      schema: { type: string }
    SkuId:
      name: skuId
      in: path
      required: true
      description: inventory_item.sku_id
      schema: { type: string }
    DictType:
      name: dictType
      in: path
      required: true
      description: 如 register_sort
      schema: { type: string }
    DictItemId:
      name: dictItemId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    BadRequest:
      description: |
        Validation / invalid amount.
        常见 code: VALIDATION_ERROR, INVALID_AMOUNT（对齐 H08）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: |
        Conflict / illegal state / business rule（对齐 H08 错误码清单）。
        常见 code: DUPLICATE_PATIENT, REGISTER_NOT_CANCELLABLE,
        REGISTER_BACK_NOT_ALLOWED, PATIENT_NOT_FOUND, DEPARTMENT_NOT_FOUND,
        DOCTOR_NOT_FOUND, ENCOUNTER_REQUIRED（已确认：收费/开单须有效挂号，退号 BACK 拒开）,
        ORDER_EMPTY_ITEMS, ORDER_INVALID_AMOUNT, ORDER_NOT_EDITABLE,
        ORDER_NOT_COMMITTABLE, ORDER_CHARGED_NOT_ABATABLE, CATALOG_ITEM_NOT_FOUND,
        ILLEGAL_STATE_TRANSITION, INSUFFICIENT_STOCK, ITEM_NOT_CAN_BACK,
        REFUND_REQUIRES_RETURN（已确认强制：已发药须先退药再退费）,
        REFUND_EXCEEDS_REFUNDABLE, CHARGE_AMOUNT_MISMATCH,
        NOT_CHARGED, ALREADY_ABATED, ALREADY_DISPENSED（≡H02 ALREADY_FULLY_DISPENSED）,
        DISPENSE_EXCEEDS_AVAILABLE, EMPTY_DISPENSE_ITEMS, NOT_DISPENSED,
        RETURN_EXCEEDS_DISPENSE, RETURN_REASON_REQUIRED,
        DEPT_CODE_DUPLICATE, DEPARTMENT_INACTIVE, DOCTOR_CODE_DUPLICATE, DOCTOR_INACTIVE,
        ITEM_NO_DUPLICATE, CATALOG_INACTIVE, INVALID_PRICE,
        ADJUST_RESULT_NEGATIVE, NOT_DRUG_SKU, USERNAME_DUPLICATE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, format: password }
    UserDto:
      type: object
      required: [id, username, displayName, roles]
      properties:
        id: { type: string, description: 用户主键 }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string }
          description: 角色代码，如 SYSTEM / REGISTRAR / DOCTOR / CASHIER / PHARMACIST
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, description: JWT（HS256） }
        tokenType: { type: string, enum: [Bearer], example: Bearer }
        expiresIn: { type: integer, description: 秒；默认 28800（8h）可配置, example: 28800 }
        user:
          $ref: '#/components/schemas/UserDto'
    ErrorBody:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        requestId: { type: string }
    CreatePatientRequest:
      type: object
      required: [name, sex, birthday, fareIdentity]
      properties:
        name: { type: string, description: '姓名必填（H02 P-01 / 建档清单）' }
        sex: { type: string, enum: [M, F, U], description: '一期必填' }
        birthday: { type: string, format: date, description: '>1900-01-01 且 ≤今天（DB CHECK >1900-01-01；≤今天由应用校验）' }
        idType: { type: string }
        idNumber: { type: string, description: '选填；非空则查重，冲突 409 DUPLICATE_ID_NUMBER / DUPLICATE_PATIENT；拒绝不合并' }
        cardNo: { type: string, description: '选填；非空则查重，冲突 409 DUPLICATE_CARD_NO；拒绝不合并' }
        phone: { type: string }
        address: { type: string, nullable: true, description: '选填可空（H02 建档清单）' }
        fareIdentity: { type: string, description: '费别一期必填' }
    PatientDto:
      type: object
      properties:
        patientId: { type: string, format: uuid, description: '契约侧 uuid 格式字符串；实现库存 varchar(64)' }
        hospPkNo: { type: string }
        patientNo: { type: string }
        cardNo: { type: string }
        name: { type: string }
        sex: { type: string }
        birthday: { type: string, format: date }
        idNumber: { type: string }
        phone: { type: string }
        address: { type: string, nullable: true }
        fareIdentity: { type: string }
        cardStatus:
          type: string
          enum: [NOT_SENT, NORMAL, LOST, CANCELLED]
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
    CreateRegisterRequest:
      type: object
      required: [patientId, departmentId, doctorId, visitDate]
      description: |
        对齐 H02 挂号字段清单。号源=科室+医生（拍板#19）；无排班。
        registerSort 可选占位；registerFee 默认 0。
      properties:
        patientId: { type: string, format: uuid, description: '必填；不存在 → PATIENT_NOT_FOUND' }
        departmentId: { type: string, description: '必填；主数据科室 id（种子如 dept-1）；不存在 → DEPARTMENT_NOT_FOUND' }
        doctorId: { type: string, description: '必填；主数据医生 id（种子如 doc-1）；不存在 → DOCTOR_NOT_FOUND' }
        visitDate: { type: string, format: date, description: '就诊日必填' }
        registerSort: { type: string, nullable: true, description: '号别可选占位（如 sort-normal）；可空' }
        registerFee: { type: number, description: '挂号费；默认 0；一期可不做正式结算' }
    RegisterDto:
      type: object
      description: |
        挂号单 DTO。域内 Encounter ≡ RegisterBill。
        订单/收费若仍用 encounterId 字段名，语义 ≡ registerId。
      properties:
        registerId: { type: string, format: uuid, description: '≡ encounterId；实现库存 varchar(64)' }
        registerNo: { type: string, description: '挂号单号 UK' }
        patientId: { type: string, format: uuid }
        departmentId: { type: string }
        doctorId: { type: string }
        registerSort: { type: string, nullable: true }
        visitDate: { type: string, format: date }
        status:
          type: string
          enum: [NORMAL, USED, BACK, DIAGNOSING, DIAGNOSED, PAUSED]
          description: 对齐 TRegisterStatus；创建默认 NORMAL
        registerFee: { type: number, description: '默认 0' }
        registerCharged: { type: boolean, description: '默认 false' }
        registeredAt: { type: string, format: date-time }
        backOperatorId: { type: string, nullable: true }
        backOperatedAt: { type: string, format: date-time, nullable: true }
    CreateEncounterRequest:
      allOf:
        - $ref: '#/components/schemas/CreateRegisterRequest'
      deprecated: true
      description: Deprecated alias of CreateRegisterRequest（encounterId≡registerId）
    EncounterDto:
      allOf:
        - $ref: '#/components/schemas/RegisterDto'
      deprecated: true
      description: |
        Deprecated alias of RegisterDto。
        兼容字段：若实现仍返回 encounterId/encounterNo/deptCode/clinicSort，
        分别对应 registerId/registerNo/departmentId/registerSort。
    CreateDiagnoseRequest:
      type: object
      properties:
        content: { type: string }
    DiagnoseDto:
      type: object
      properties:
        diagnoseId: { type: string, format: uuid }
        encounterId: { type: string, format: uuid, description: '≡ registerId' }
        status: { type: string, enum: [NEW, SAVE, COMMIT, ABATE] }
        content: { type: string }
    OrderItemInput:
      type: object
      required: [itemNo, itemType, itemName, amount, price]
      properties:
        lineNo: { type: integer, description: 行号；创建时可省略由服务端按序生成（从 1） }
        itemNo: { type: string, description: 目录编码（如 DRUG-A / TREAT-1） }
        itemType: { type: string, enum: [DRUG, TREAT], description: '药品 DRUG / 治疗 TREAT（一期；原 SERVICE 改为 TREAT）' }
        itemName: { type: string }
        spec: { type: string, nullable: true, description: 规格（目录带出） }
        units: { type: string, description: 单位（目录带出；原 unit 字段更名为 units） }
        amount: { type: number, description: '数量；须 > 0（提交时强制；暂存建议亦 >0）' }
        price: { type: number, description: '单价；≥ 0' }
        totalFee: { type: number, description: '行金额；可省略由服务端 round2(amount*price)' }
        usageText: { type: string, nullable: true, description: 用法文案（选填） }
        frequencyText: { type: string, nullable: true, description: 频次文案（选填） }
        dosage: { type: string, nullable: true }
        dosageUnit: { type: string, nullable: true }
        procDepartmentId: { type: string, nullable: true, description: 执行科室（选填） }
    CreateOrderRequest:
      type: object
      required: [registerId]
      description: |
        创建/暂存。registerId 必填且须有效（status≠BACK）。
        encounterId 为同义别名；若同时传入须与 registerId 一致。
        items 可空（纯草稿）；commit 时至少 1 行。
      properties:
        registerId:
          type: string
          format: uuid
          description: '挂号单 ID；须有效且 status≠BACK，否则 ENCOUNTER_REQUIRED（#21a）'
        encounterId:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: '≡ registerId（别名）；优先用 registerId'
        patientId:
          type: string
          format: uuid
          nullable: true
          description: '可选；默认从挂号带出；若传须与挂号 patientId 一致'
        departmentId:
          type: string
          format: uuid
          nullable: true
          description: '开单科室；默认挂号科室'
        doctorId:
          type: string
          format: uuid
          nullable: true
          description: '开单医生；默认=挂号医生，允许改（#21b）'
        diagnoseName:
          type: string
          nullable: true
          description: '诊断简述；不强制（#21c）；UI 鼓励填写'
        recipeSort:
          type: string
          nullable: true
          description: '处方类别；默认 NORMAL；毒麻精抗权校验本版关闭（feature flag 默认 off）'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
          description: 明细；创建时可空；commit 至少 1 行
    PatchOrderRequest:
      type: object
      description: |
        仅 SAVE 可 PATCH。含 items 时全量替换明细；省略 items 则只改头。
        不可改 registerId。
      properties:
        patientId: { type: string, format: uuid, nullable: true }
        departmentId: { type: string, format: uuid, nullable: true }
        doctorId: { type: string, format: uuid, nullable: true, description: 允许改开单医生 }
        diagnoseName: { type: string, nullable: true }
        recipeSort: { type: string, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
          description: 若出现则全量替换明细行
    OrderItemDto:
      allOf:
        - $ref: '#/components/schemas/OrderItemInput'
        - type: object
          required: [orderItemId, totalFee]
          properties:
            orderItemId: { type: string, format: uuid }
            totalFee: { type: number, description: '行金额 round2(amount*price)' }
    OrderDto:
      type: object
      required: [orderId, orderNo, registerId, patientId, departmentId, doctorId, status, totalFee, charged]
      properties:
        orderId: { type: string, format: uuid }
        orderNo: { type: string, description: 系统生成处方号 }
        registerId:
          type: string
          format: uuid
          description: '挂号单 ID（主字段）'
        encounterId:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: '≡ registerId（别名，响应可同时返回）'
        patientId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        diagnoseName: { type: string, nullable: true }
        recipeSort: { type: string, nullable: true, description: 默认 NORMAL }
        status:
          type: string
          enum: [SAVE, COMMIT, PROC, ABATE]
          description: |
            一期四态（拍板#21 / 004_order CHECK）。
            SAVE=暂存不可收费；COMMIT=已提交可收费；PROC=发药执行；ABATE=作废终态。
            RECIPE_CHECK 等 CureBill 扩展态一期跳过（不入库 CHECK）。
        totalFee: { type: number, description: 'Σ明细；commit 时强制重算' }
        charged: { type: boolean, description: '是否已收费；true 时不可 abate' }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'
        submittedAt: { type: string, format: date-time, nullable: true }
        abatedAt: { type: string, format: date-time, nullable: true }
        abatedBy: { type: string, nullable: true }
    ChargeItemDto:
      type: object
      required: [chargeItemId, lineNo, itemNo, itemName, qty, unitPrice, totalFee, canBack]
      properties:
        chargeItemId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid, nullable: true }
        lineNo: { type: integer }
        itemNo: { type: string }
        itemName: { type: string }
        qty:
          type: number
          description: '收费数量；须 >0（C-02）。API 亦可用 amount 别名（实现择一，契约主字段 qty）'
        unitPrice:
          type: number
          description: '单价。API 亦可用 price 别名'
        totalFee: { type: number }
        canBack: { type: boolean, description: '可退标记；false → ITEM_NOT_CAN_BACK' }
        refundedQty: { type: number, description: '已退数量；默认 0；≤qty' }
    ChargeDto:
      type: object
      required: [chargeId, squareNo, registerId, patientId, totalFee, squareFee, favourableFee, status]
      description: |
        结算单（Square）。主字段 registerId；encounterId≡registerId 别名。
        拍板#22a：无有效挂号不可创建/支付 → ENCOUNTER_REQUIRED。
      properties:
        chargeId: { type: string, format: uuid }
        squareNo: { type: string }
        orderId: { type: string, format: uuid, nullable: true, description: 'Phase1 主路径有值；可空策略允许多来源' }
        registerId:
          type: string
          format: uuid
          description: '挂号单 ID（主字段，必填）；≡ encounterId'
        encounterId:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: '≡ registerId（别名）；响应可同时返回'
        patientId: { type: string, format: uuid }
        totalFee: { type: number, description: '毛额 G；F=0 时与 squareFee 同（K-01/K-02）' }
        squareFee: { type: number, description: '应收 R = G - F' }
        favourableFee: { type: number, description: '整单优惠 F；Phase1 验收主路径 0（#22c）' }
        status:
          type: string
          enum: [NORMAL, ABATE]
          description: 对齐 TSquareStatus / H08
        successorChargeId:
          type: string
          format: uuid
          nullable: true
          description: '作废后生成的新单（未退部分）；全退为 null。旧名 successorSquareId 弃用'
        abatedFromId:
          type: string
          format: uuid
          nullable: true
          description: 若本单由退费生成，指向被作废原单
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChargeItemDto'
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: '支付成功时间；待收为 null'
    PayRequest:
      type: object
      required: [payType, amount]
      description: |
        拍板#22b/22f：现金一次付清；amount 必须等于 Charge.squareFee（实收=应收，不允许多收找零）。
      properties:
        paymentNo: { type: string, nullable: true, description: '可选；省略由服务端生成' }
        payType:
          type: string
          enum: [CASH, OTHER_E, WECHAT, ALIPAY, OTHER]
          description: |
            Phase1（拍板#13/#22b）：演示主用 CASH；
            OTHER_E/WECHAT/ALIPAY 字段预留可落库，不联调第三方。
        amount:
          type: number
          description: '必须 = squareFee；否则 CHARGE_AMOUNT_MISMATCH / INVALID_AMOUNT'
    FavourableAlloc:
      type: string
      enum: [PROPORTIONAL, DISCOUNT_ON_REMAIN, DISCOUNT_FIRST]
      default: PROPORTIONAL
      description: |
        部分退优惠分摊策略（H08《金额核对点》§4 **草稿待确认**，非正式拍板 #22c）。
        PROPORTIONAL：按退毛额占比分摊（H08 推荐草稿 / 默认可配）。
        DISCOUNT_ON_REMAIN：优惠留在未退。
        DISCOUNT_FIRST：优惠优先退。
        Phase1：F=0 时可忽略本字段，硬断言 K-01～K-05（收费）/ K-10～K-15（退费）；F>0 期望值待用户经 H01 确认。
    RefundRequest:
      type: object
      required: [payType, items]
      description: |
        对齐 H08 交接 §1.4 + 拍板#22。
        前置：Square=NORMAL；已发药明细必须先退药成功，否则 409 REFUND_REQUIRES_RETURN（#22h / B-08）。
        全退：不生成金额为 0 的新 Square → newSquare=null（#22e）。
      properties:
        reason: { type: string, description: '退费原因；建议填写' }
        payType:
          type: string
          enum: [CASH, OTHER_E, WECHAT, ALIPAY, OTHER]
          description: Phase1 演示 CASH；电子枚举预留不联调
        favourableAlloc:
          $ref: '#/components/schemas/FavourableAlloc'
        items:
          type: array
          items:
            type: object
            required: [chargeItemId, refundQty]
            properties:
              chargeItemId: { type: string, format: uuid }
              refundQty:
                type: number
                description: |
                  部分数量退；须 ≤可退且 canBack。
                  已发药明细须先退药，否则 REFUND_REQUIRES_RETURN。
                  超额 → REFUND_EXCEEDS_REFUNDABLE；金额非法 → INVALID_AMOUNT。
    RefundResultDto:
      type: object
      required: [abatedCharge, refundPayment]
      description: |
        退费响应。全退时 newSquare 必须为 null（#22e）；部分退时 newSquare 为承接未退的新 NORMAL。
      properties:
        abatedCharge:
          $ref: '#/components/schemas/ChargeDto'
          description: '已作废原单（status=ABATE）'
        newSquare:
          allOf:
            - $ref: '#/components/schemas/ChargeDto'
          nullable: true
          description: '未退部分新 Square；**全退必须 null**（不生成金额 0 新单）'
        refundPayment:
          $ref: '#/components/schemas/PaymentDto'
    PaymentDto:
      type: object
      required: [paymentId, paymentNo, chargeId, direction, payType, amount, status]
      properties:
        paymentId: { type: string, format: uuid }
        paymentNo: { type: string }
        chargeId: { type: string, format: uuid }
        direction:
          type: string
          enum: [CHARGE, REFUND]
          description: 收费 CHARGE / 退款 REFUND（H08）
        payType:
          type: string
          enum: [CASH, OTHER_E, WECHAT, ALIPAY, OTHER]
          description: Phase1 演示 CASH；电子枚举预留可落库、不联调
        amount:
          type: number
          description: '≥0；收费时须 = squareFee；非法 → INVALID_AMOUNT'
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
          description: 支付/退费成功须为 SUCCEEDED（H08）；Phase1 成功写 SUCCEEDED
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: '成功时间（主字段）；succeededAt 为兼容别名'
        succeededAt:
          type: string
          format: date-time
          nullable: true
          deprecated: true
          description: '≡ paidAt（别名）'
    DispenseRequest:
      type: object
      required: [orderId, items]
      description: |
        确认发药。chargeId 主路径建议必填（可由 orderId 解析）；items 仅 DRUG。
        dispenseQty 默认=availableQty，可改小（部分发）。
      properties:
        orderId: { type: string, format: uuid }
        chargeId:
          type: string
          format: uuid
          description: 已支付 NORMAL Charge；缺省时由实现按 orderId 解析唯一有效单
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [dispenseQty]
            properties:
              orderItemId: { type: string, format: uuid }
              chargeItemId: { type: string, format: uuid, description: 与 orderItemId 至少填一 }
              dispenseQty:
                type: number
                description: 本次发药数量；0 < qty ≤ availableQty
              selected:
                type: boolean
                description: UI 勾选；服务端以 dispenseQty>0 为准
    ReturnDispenseRequest:
      type: object
      required: [reason, items]
      properties:
        reason:
          type: string
          minLength: 1
          description: 退药原因必填（B-05 / RETURN_REASON_REQUIRED）
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [dispenseItemId, returnQty]
            properties:
              dispenseItemId: { type: string, format: uuid }
              returnQty:
                type: number
                description: 退数量；0 < qty ≤ 可退（已发−已退）
    DispenseItemDto:
      type: object
      properties:
        dispenseItemId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid, nullable: true }
        chargeItemId: { type: string, format: uuid, nullable: true }
        itemNo: { type: string, description: 目录编码，仅 DRUG }
        itemName: { type: string }
        units: { type: string }
        chargedQty: { type: number, description: 已收费数量（快照） }
        dispensedQty: { type: number, description: 本单发药数量；聚合查询时可为净发累计 }
        returnedQty: { type: number, description: 本单已退数量 }
        availableQty:
          type: number
          description: chargedQty − 净发（净发=累计已发−累计已退）；待发载入用
        dispenseQty:
          type: number
          description: 本次请求发药数量（请求回显）
        stockHint:
          type: string
          description: 库存提示文案（不足标红）
        stockQty:
          type: number
          description: 当前 qty_on_hand（提示用）
        lineDispenseStatus:
          type: string
          enum: [NONE, PARTIAL, FULL]
          description: |
            相对收费行净发：NONE=净发0；PARTIAL=0<净发<charged；FULL=净发=charged
    DispenseDto:
      type: object
      required: [dispenseId, dispenseNo, orderId, status, items]
      properties:
        dispenseId: { type: string, format: uuid }
        dispenseNo: { type: string }
        orderId: { type: string, format: uuid }
        chargeId: { type: string, format: uuid, nullable: true }
        registerId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        status:
          type: string
          enum: [DONE, PARTIAL_RETURNED, RETURNED]
          description: 本发药单头状态（DONE=已记账；PARTIAL_RETURNED=部分退；RETURNED=本单净发0）
        orderStatus:
          type: string
          description: |
            权威处方状态。有净发→PROC。一期不扩 RECIPE_UNCHECK 入库；
            退费前置以行净发数量判定（净发>0 → REFUND_REQUIRES_RETURN）。
        returnReason: { type: string, nullable: true }
        operatorId: { type: string, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/DispenseItemDto'
        dispensedAt: { type: string, format: date-time }
    InventoryItemDto:
      type: object
      properties:
        skuId: { type: string, format: uuid }
        skuCode: { type: string, description: ≡ item_no（如 DRUG-A） }
        itemNo: { type: string, description: ≡ skuCode }
        name: { type: string }
        itemName: { type: string, description: ≡ name；冗余展示 }
        qtyOnHand: { type: number, description: 权威可用量；≥0 }
        units: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        rowVersion:
          type: string
          description: 乐观锁令牌（实现可将 rowversion 编为 base64/十进制字符串）
        updatedAt: { type: string, format: date-time }
    AdjustInventoryRequest:
      type: object
      required: [qtyDelta, remark]
      description: |
        qtyDelta 可负；结果 qtyOnHand+qtyDelta ≥0。remark 建议必填（期初/盘点/纠错）。
        biz_type 固定 ADJUST（不新造 INIT）。
      properties:
        qtyDelta: { type: number, description: 可正可负 }
        remark: { type: string, minLength: 1, description: 调整原因建议必填 }
        rowVersion:
          type: string
          description: 可选；携带则做乐观锁校验
    HealthDto:
      type: object
      required: [status, contractVersion]
      properties:
        status: { type: string, enum: [UP], example: UP }
        contractVersion:
          type: string
          description: 对齐 info.version
          example: 0.3.10-draft
        implementedVersion:
          type: string
          description: 实现仓版本（可选；由 H04 填）
    DepartmentDto:
      type: object
      required: [departmentId, deptCode, deptName, status]
      properties:
        departmentId: { type: string }
        deptCode: { type: string }
        deptName: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortNo: { type: integer, description: 可选排序；默认 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDepartmentRequest:
      type: object
      required: [deptCode, deptName]
      properties:
        deptCode: { type: string, minLength: 1 }
        deptName: { type: string, minLength: 1 }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
        sortNo: { type: integer, default: 0 }
    PatchDepartmentRequest:
      type: object
      properties:
        deptCode: { type: string }
        deptName: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortNo: { type: integer }
    DoctorDto:
      type: object
      required: [doctorId, doctorCode, doctorName, departmentId, status]
      properties:
        doctorId: { type: string }
        doctorCode: { type: string }
        doctorName: { type: string }
        departmentId: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDoctorRequest:
      type: object
      required: [doctorCode, doctorName, departmentId]
      properties:
        doctorCode: { type: string, minLength: 1 }
        doctorName: { type: string, minLength: 1 }
        departmentId: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
    PatchDoctorRequest:
      type: object
      properties:
        doctorCode: { type: string }
        doctorName: { type: string }
        departmentId: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CatalogItemDto:
      type: object
      required: [catalogItemId, itemNo, itemName, itemType, units, price, status]
      properties:
        catalogItemId: { type: string }
        itemNo: { type: string }
        itemName: { type: string }
        itemType: { type: string, enum: [DRUG, TREAT] }
        spec: { type: string, nullable: true }
        units: { type: string }
        price: { type: number, description: ≥0；开单快照用 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        controlledFlag:
          type: boolean
          description: 毒麻钩子（≡ isControlled）；默认 false；本版隐藏/不拦
          default: false
        isControlled:
          type: boolean
          description: ≡ controlledFlag
          default: false
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateCatalogItemRequest:
      type: object
      required: [itemNo, itemName, itemType, units, price]
      properties:
        itemNo: { type: string, minLength: 1 }
        itemName: { type: string, minLength: 1 }
        itemType: { type: string, enum: [DRUG, TREAT] }
        spec: { type: string, nullable: true }
        units: { type: string, minLength: 1 }
        price: { type: number, minimum: 0 }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
        controlledFlag: { type: boolean, default: false }
        isControlled: { type: boolean, default: false }
    PatchCatalogItemRequest:
      type: object
      properties:
        itemNo: { type: string }
        itemName: { type: string }
        spec: { type: string, nullable: true }
        units: { type: string }
        price: { type: number, minimum: 0 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        controlledFlag: { type: boolean }
        isControlled: { type: boolean }
    DictOverviewDto:
      type: object
      properties:
        readonlyEnums:
          type: array
          description: 只读系统枚举（与契约对齐；改枚举走发版）
          items:
            type: object
            properties:
              dictType: { type: string, example: sex }
              values:
                type: array
                items: { type: string }
                example: [M, F, U]
        maintainableTypes:
          type: array
          description: 可维护码表类型
          items:
            type: object
            properties:
              dictType: { type: string, example: register_sort }
              name: { type: string, example: 号别 }
    DictItemDto:
      type: object
      required: [dictItemId, dictType, code, name, status]
      properties:
        dictItemId: { type: string }
        dictType: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortNo: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDictItemRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
        sortNo: { type: integer, default: 0 }
    PatchDictItemRequest:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortNo: { type: integer }
    UserAdminDto:
      type: object
      required: [userId, username, displayName, status, roles]
      description: 管理面用户 DTO；不含 password / passwordHash
      properties:
        userId: { type: string }
        username: { type: string, description: ≡ loginName }
        loginName: { type: string, description: ≡ username }
        displayName: { type: string }
        status:
          type: string
          enum: [ACTIVE, DISABLED, INACTIVE]
          description: DISABLED/INACTIVE 均视为停用 → 登录 ACCOUNT_DISABLED
        roles:
          type: array
          items: { type: string }
          description: 预置 Role 代码（registrar/doctor/cashier/pharmacist/SYSTEM）
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [username, displayName]
      description: |
        新建采用演示默认口令策略（#15/#16）；勿在请求示例中写生产秘密。
        可选显式 password 字段仅供实现期本地覆盖；契约不要求客户端传明文。
      properties:
        username: { type: string, minLength: 1 }
        loginName: { type: string, description: ≡ username 别名 }
        displayName: { type: string, minLength: 1 }
        roles:
          type: array
          items: { type: string }
          description: 预置角色；默认可空或 SYSTEM 外业务角色
        status: { type: string, enum: [ACTIVE, DISABLED], default: ACTIVE }
    PatchUserRequest:
      type: object
      properties:
        displayName: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED, INACTIVE] }
        roles:
          type: array
          items: { type: string }
